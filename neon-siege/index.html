<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/><meta name="theme-color" content="#05070b"/><title>NEON SIEGE</title><style>:root{--c:#39e3d2;--p:#ff357f;--a:#f5b942}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#app,#touch,#upgrade-overlay,#rotate,button{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;overscroll-behavior:none;touch-action:none}body{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}#touch{display:none;position:fixed;inset:0;z-index:20;pointer-events:none;font-family:ui-monospace,monospace;touch-action:none;overscroll-behavior:none}.cluster,.select{pointer-events:auto;position:absolute;touch-action:none}.cluster{bottom:calc(8px + env(safe-area-inset-bottom));display:flex;gap:7px;align-items:end}.left{left:calc(8px + env(safe-area-inset-left));flex-wrap:wrap;width:112px}.right{right:calc(8px + env(safe-area-inset-right))}button{touch-action:none;border:1px solid #ffffff33;background:#080d12cc;color:#eef4f6;font:800 9px ui-monospace,monospace;cursor:default}.action{width:48px;height:48px;border-radius:50%}.lane{width:42px;height:32px;border-radius:12px;border-color:#f5b94277;color:var(--a)}.fire{width:56px;height:56px;border-color:var(--p)}.jump{border-color:var(--c)}.build{border-color:var(--a)}.select{left:50%;transform:translateX(-50%);display:flex;gap:3px;background:#05090dcc;padding:3px;border-radius:12px}.weapons{bottom:44px}.towers{bottom:10px}.select button{height:26px;border-radius:10px;padding:0 7px}.selected{border-color:var(--c);color:var(--c)}.weapons .selected{border-color:var(--p);color:var(--p)}#upgrade-overlay{display:none;position:fixed;inset:0;z-index:60;background:#030609e8;align-items:center;justify-content:center;padding:24px;font-family:ui-monospace,monospace;touch-action:none}#upgrade-overlay.is-open{display:flex}.upgrade-panel{width:min(880px,96vw);border:1px solid #39e3d255;background:#080d12;padding:20px;box-shadow:0 0 70px #39e3d218}.upgrade-panel h2{margin:0 0 16px;color:#eef4f6;font-size:16px;letter-spacing:.08em}.upgrade-panel p{color:#74818a;font-size:10px;margin:0 0 14px}#upgrade-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.upgrade-card{min-height:120px;text-align:left;padding:14px;border-color:#ffffff25;background:#0d141bcc}.upgrade-card:hover,.upgrade-card:active{border-color:var(--p);background:#1b1018}.upgrade-card b{display:block;color:var(--p);font-size:11px;margin-bottom:14px}.upgrade-card span{display:block;color:#cbd4d8;font-size:10px;line-height:1.5}#rotate{display:none;position:fixed;inset:0;z-index:70;background:#05070b;color:white;place-items:center;text-align:center;font:800 16px ui-monospace,monospace;touch-action:none}@media(pointer:coarse),(max-width:1024px){#touch{display:block}}@media(pointer:coarse) and (orientation:portrait) and (max-width:700px){#rotate{display:grid}}@media(max-width:760px){.select button{font-size:7px;padding:0 5px}.action{width:43px;height:43px}.fire{width:50px;height:50px}.lane{width:39px;height:29px}.upgrade-panel{padding:12px}#upgrade-cards{gap:7px}.upgrade-card{min-height:100px;padding:9px}.upgrade-card b{font-size:9px;margin-bottom:8px}.upgrade-card span{font-size:8px}}</style></head><body><div id="app"></div><div id="touch"><div class="cluster left"><button class="action" data-hold="ArrowLeft">◀</button><button class="action" data-hold="ArrowRight">▶</button><button class="lane" data-tap="KeyW">LANE▲</button><button class="lane" data-tap="KeyS">LANE▼</button></div><div class="select weapons"><button class="selected" data-tap="KeyZ">PST</button><button data-tap="KeyX">SMG</button><button data-tap="KeyC">SG</button><button data-tap="KeyV">RAIL</button></div><div class="select towers"><button class="selected" data-tap="Digit1">GUN</button><button data-tap="Digit2">TES</button><button data-tap="Digit3">BAR</button><button data-tap="Digit4">DRN</button><button data-tap="Digit5">HACK</button><button data-tap="Digit6">MINE</button></div><div class="cluster right"><button class="action jump" data-tap="Space">JMP</button><button class="action fire" data-hold="KeyJ">FIRE</button><button class="action build" data-tap="KeyB">BUILD</button><button class="action" data-hold="KeyE">FIX</button></div></div><div id="upgrade-overlay"><div class="upgrade-panel"><h2 id="upgrade-title">INSTALL AUGMENT</h2><p>Choose one. This install persists for the current run.</p><div id="upgrade-cards"></div></div></div><div id="rotate">ROTATE DEVICE<br/>SECTOR 07 REQUIRES LANDSCAPE</div><script>(()=>{const send=(t,c)=>window.dispatchEvent(new KeyboardEvent(t,{code:c,bubbles:true}));const release=b=>{const c=b.dataset.hold;if(!c)return;b.classList.remove('active');send('keyup',c)};const prevent=e=>e.preventDefault();document.addEventListener('contextmenu',prevent,{passive:false});document.addEventListener('dblclick',prevent,{passive:false});document.addEventListener('gesturestart',prevent,{passive:false});document.addEventListener('gesturechange',prevent,{passive:false});document.addEventListener('gestureend',prevent,{passive:false});document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});document.querySelectorAll('[data-hold]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);b.classList.add('active');send('keydown',b.dataset.hold)});['pointerup','pointercancel','lostpointercapture'].forEach(x=>b.addEventListener(x,()=>release(b)))});document.querySelectorAll('[data-tap]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();send('keydown',b.dataset.tap);setTimeout(()=>send('keyup',b.dataset.tap),60);const p=b.parentElement;if(p?.classList.contains('select')){p.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}}));window.addEventListener('blur',()=>document.querySelectorAll('[data-hold]').forEach(release))})();</script><script type="module" src="/src/main.ts"></script></body></html>
