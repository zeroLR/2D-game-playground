            rune-ball/src/evolution.css \
            rune-ball/src/main.ts \
            rune-ball/tests/rune-evolution-catalog.test.ts \
            rune-ball/tests/player-profile.test.ts \
            rune-ball/tests/split-evolution-system.test.ts \
            rune-ball/tests/split-evolution-tuning.test.ts \
            rune-ball/README.md \
            docs/plans/rune-ball/P8-3-SPLIT-EVOLUTION.md
          git commit -m 'feat(rune-ball): author Split evolution paths'
          git push origin HEAD:feat/rune-ball-p8-3-split-evolution
