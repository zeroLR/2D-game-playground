name: Rune Ball P8.3 patch

on:
  push:
    branches:
      - feat/rune-ball-p8-3-split-evolution

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rune-ball-p8-3-split-evolution
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply P8.3 source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'missing replacement target: {label}')
              return text.replace(old, new, 1)

          catalog = r'''export type RuneTreeId = 'vortex' | 'split' | 'chain';
          export type VortexEvolutionPath = 'gravity-well' | 'orbit';
          export type VortexEvolutionStage = 0 | 1 | 2;
          export type VortexEvolutionTier = 1 | 2;
          export type SplitEvolutionPath = 'prism' | 'lance';
          export type SplitEvolutionStage = 0 | 1 | 2;
          export type SplitEvolutionTier = 1 | 2;

          export interface RuneBaseDefinition {
            id: RuneTreeId;
            glyph: string;
            name: string;
            role: string;
            description: string;
            playPattern: string;
            evolutionStatus: 'authored' | 'future';
          }

          export interface VortexEvolutionNodeDefinition {
            id: string;
            tier: VortexEvolutionTier;
            name: string;
            threshold: number;
            description: string;
            playPattern: string;
          }

          export interface VortexEvolutionPathDefinition {
            id: VortexEvolutionPath;
            title: string;
            identity: string;
            summary: string;
            tierOne: VortexEvolutionNodeDefinition;
            tierTwo: VortexEvolutionNodeDefinition;
          }

          export interface SplitEvolutionNodeDefinition {
            id: string;
            tier: SplitEvolutionTier;
            name: string;
            threshold: number;
            description: string;
            playPattern: string;
          }

          export interface SplitEvolutionPathDefinition {
            id: SplitEvolutionPath;
            title: string;
            identity: string;
            summary: string;
            tierOne: SplitEvolutionNodeDefinition;
            tierTwo: SplitEvolutionNodeDefinition;
          }

          export const VORTEX_TIER_ONE_THRESHOLD = 3;
          export const VORTEX_TIER_TWO_THRESHOLD = 6;
          export const SPLIT_TIER_ONE_THRESHOLD = 3;
          export const SPLIT_TIER_TWO_THRESHOLD = 6;

          export const RUNE_BASE_DEFINITIONS: Readonly<Record<RuneTreeId, RuneBaseDefinition>> = {
            vortex: {
              id: 'vortex',
              glyph: '○',
              name: 'VORTEX',
              role: 'SETUP / CONTROL',
              description: 'Pull nearby targets toward a useful impact zone.',
              playPattern: 'Gather → reposition → create the next break window',
              evolutionStatus: 'authored',
            },
            split: {
              id: 'split',
              glyph: 'V',
              name: 'SPLIT',
              role: 'TRAJECTORY / ECHO',
              description: 'Create temporary attack echoes that reshape the core impact into multiple attack lanes.',
              playPattern: 'Multiply lanes → reshape attack space',
              evolutionStatus: 'authored',
            },
            chain: {
              id: 'chain',
              glyph: 'Z',
              name: 'CHAIN',
              role: 'PROPAGATION / PAYOFF',
              description: 'Arm the next impact so destruction propagates across nearby targets.',
              playPattern: 'Prime impact → propagate the break',
              evolutionStatus: 'future',
            },
          };

          export const VORTEX_EVOLUTION_PATHS: Readonly<Record<VortexEvolutionPath, VortexEvolutionPathDefinition>> = {
            'gravity-well': {
              id: 'gravity-well',
              title: 'GRAVITY',
              identity: 'CLUSTER / COLLAPSE',
              summary: 'Gather targets harder, then cash the cluster into a collapse payoff.',
              tierOne: {
                id: 'gravity-well',
                tier: 1,
                name: 'GRAVITY WELL',
                threshold: VORTEX_TIER_ONE_THRESHOLD,
                description: 'The field becomes larger, lasts longer, and pulls targets inward more strongly.',
                playPattern: 'Gather → compress → line up the core',
              },
              tierTwo: {
                id: 'singularity',
                tier: 2,
                name: 'SINGULARITY',
                threshold: VORTEX_TIER_TWO_THRESHOLD,
                description: 'The stronger Gravity Well ends every evolved Vortex with a collapse pulse.',
                playPattern: 'Gather → collapse → chain payoff',
              },
            },
            orbit: {
              id: 'orbit',
              title: 'ORBIT',
              identity: 'CAPTURE / CONTROL',
              summary: 'Capture targets into orbital motion and hold a longer setup window.',
              tierOne: {
                id: 'orbit',
                tier: 1,
                name: 'ORBIT',
                threshold: VORTEX_TIER_ONE_THRESHOLD,
                description: 'Targets gain tangential motion while the Vortex continues pulling them inward.',
                playPattern: 'Capture → orbit → redirect',
              },
              tierTwo: {
                id: 'event-horizon',
                tier: 2,
                name: 'EVENT HORIZON',
                threshold: VORTEX_TIER_TWO_THRESHOLD,
                description: 'The orbital control field becomes larger, longer-lived, and stronger.',
                playPattern: 'Capture → sustain → release',
              },
            },
          };

          export const SPLIT_EVOLUTION_PATHS: Readonly<Record<SplitEvolutionPath, SplitEvolutionPathDefinition>> = {
            prism: {
              id: 'prism',
              title: 'PRISM',
              identity: 'COVERAGE / SPREAD',
              summary: 'Fan Split echoes outward so one core trajectory pressures a much wider slice of the arena.',
              tierOne: {
                id: 'refraction',
                tier: 1,
                name: 'REFRACTION',
                threshold: SPLIT_TIER_ONE_THRESHOLD,
                description: 'Split unfolds into four offset echoes that cover a wider attack fan.',
                playPattern: 'Fan → cover → catch side targets',
              },
              tierTwo: {
                id: 'aurora-prism',
                tier: 2,
                name: 'AURORA PRISM',
                threshold: SPLIT_TIER_TWO_THRESHOLD,
                description: 'The fan expands into six echoes, turning the moving core into a broad sweep across the arena.',
                playPattern: 'Spread → sweep → multiply breaks',
              },
            },
            lance: {
              id: 'lance',
              title: 'LANCE',
              identity: 'FOCUS / PIERCE',
              summary: 'Collapse Split echoes onto the travel axis and trade coverage for deliberate forward reach.',
              tierOne: {
                id: 'convergence',
                tier: 1,
                name: 'CONVERGENCE',
                threshold: SPLIT_TIER_ONE_THRESHOLD,
                description: 'Split echoes converge near the forward axis and extend the core impact ahead of the ball.',
                playPattern: 'Align → focus → pierce',
              },
              tierTwo: {
                id: 'void-lance',
                tier: 2,
                name: 'VOID LANCE',
                threshold: SPLIT_TIER_TWO_THRESHOLD,
                description: 'A longer forward echo column turns precise ball direction into a sustained piercing pressure line.',
                playPattern: 'Aim → pierce → drive through',
              },
            },
          };

          export const RUNE_TREE_ORDER: readonly RuneTreeId[] = ['vortex', 'split', 'chain'];
          export const VORTEX_PATH_ORDER: readonly VortexEvolutionPath[] = ['gravity-well', 'orbit'];
          export const SPLIT_PATH_ORDER: readonly SplitEvolutionPath[] = ['prism', 'lance'];

          export function getRuneBaseDefinition(id: RuneTreeId): RuneBaseDefinition {
            return RUNE_BASE_DEFINITIONS[id];
          }

          export function getVortexPathDefinition(path: VortexEvolutionPath): VortexEvolutionPathDefinition {
            return VORTEX_EVOLUTION_PATHS[path];
          }

          export function getVortexEvolutionNode(
            path: VortexEvolutionPath,
            tier: VortexEvolutionTier,
          ): VortexEvolutionNodeDefinition {
            const definition = getVortexPathDefinition(path);
            return tier === 1 ? definition.tierOne : definition.tierTwo;
          }

          export function getVortexEvolutionStageName(
            path: VortexEvolutionPath,
            stage: VortexEvolutionStage,
          ): string {
            if (stage === 0) return RUNE_BASE_DEFINITIONS.vortex.name;
            return getVortexEvolutionNode(path, stage).name;
          }

          export function getSplitPathDefinition(path: SplitEvolutionPath): SplitEvolutionPathDefinition {
            return SPLIT_EVOLUTION_PATHS[path];
          }

          export function getSplitEvolutionNode(
            path: SplitEvolutionPath,
            tier: SplitEvolutionTier,
          ): SplitEvolutionNodeDefinition {
            const definition = getSplitPathDefinition(path);
            return tier === 1 ? definition.tierOne : definition.tierTwo;
          }

          export function getSplitEvolutionStageName(
            path: SplitEvolutionPath,
            stage: SplitEvolutionStage,
          ): string {
            if (stage === 0) return RUNE_BASE_DEFINITIONS.split.name;
            return getSplitEvolutionNode(path, stage).name;
          }
          '''
          Path('rune-ball/src/progression/RuneEvolutionCatalog.ts').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in catalog.splitlines()) + '\n')

          split_system = r'''import {
            SPLIT_TIER_ONE_THRESHOLD,
            SPLIT_TIER_TWO_THRESHOLD,
            getSplitEvolutionStageName,
            type SplitEvolutionPath,
            type SplitEvolutionStage,
          } from './RuneEvolutionCatalog';

          export type { SplitEvolutionPath } from './RuneEvolutionCatalog';
          export type { SplitEvolutionStage } from './RuneEvolutionCatalog';

          export interface SplitEvolutionSnapshot {
            path: SplitEvolutionPath;
            stage: SplitEvolutionStage;
            qualifiedUses: number;
            nextThreshold: number | null;
            progressToNext: number;
            stageName: string;
          }

          export interface SplitEvolutionAdvance {
            snapshot: SplitEvolutionSnapshot;
            evolved: boolean;
          }

          export class SplitEvolutionSystem {
            private readonly path: SplitEvolutionPath;
            private qualifiedUses = 0;
            private stage: SplitEvolutionStage = 0;

            constructor(path: SplitEvolutionPath) {
              this.path = path;
            }

            get snapshot(): SplitEvolutionSnapshot {
              const nextThreshold = this.stage === 0
                ? SPLIT_TIER_ONE_THRESHOLD
                : this.stage === 1
                  ? SPLIT_TIER_TWO_THRESHOLD
                  : null;
              const previousThreshold = this.stage === 0 ? 0 : SPLIT_TIER_ONE_THRESHOLD;
              const progressToNext = nextThreshold === null
                ? 1
                : Math.min(1, Math.max(0, (this.qualifiedUses - previousThreshold) / (nextThreshold - previousThreshold)));

              return {
                path: this.path,
                stage: this.stage,
                qualifiedUses: this.qualifiedUses,
                nextThreshold,
                progressToNext,
                stageName: getSplitEvolutionStageName(this.path, this.stage),
              };
            }

            registerQualifiedUse(): SplitEvolutionAdvance {
              if (this.stage === 2) return { snapshot: this.snapshot, evolved: false };

              this.qualifiedUses = Math.min(SPLIT_TIER_TWO_THRESHOLD, this.qualifiedUses + 1);
              const previousStage = this.stage;
              if (this.qualifiedUses >= SPLIT_TIER_TWO_THRESHOLD) this.stage = 2;
              else if (this.qualifiedUses >= SPLIT_TIER_ONE_THRESHOLD) this.stage = 1;

              return {
                snapshot: this.snapshot,
                evolved: this.stage !== previousStage,
              };
            }
          }
          '''
          Path('rune-ball/src/progression/SplitEvolutionSystem.ts').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in split_system.splitlines()) + '\n')

          split_tuning = r'''import type { Point2D } from '../input/SwipeClassifier';
          import type { SplitEvolutionPath, SplitEvolutionStage } from './RuneEvolutionCatalog';

          export interface SplitEchoOffset {
            forward: number;
            lateral: number;
          }

          export interface SplitCastProfile {
            durationSeconds: number;
            hitRadius: number;
            offsets: readonly SplitEchoOffset[];
          }

          export const BASE_SPLIT_PROFILE: SplitCastProfile = {
            durationSeconds: 1.25,
            hitRadius: 13,
            offsets: [
              { forward: 0, lateral: 42 },
              { forward: 0, lateral: -42 },
            ],
          };

          export function getSplitCastProfile(
            path: SplitEvolutionPath,
            stage: SplitEvolutionStage,
          ): SplitCastProfile {
            if (stage === 0) return BASE_SPLIT_PROFILE;

            if (path === 'prism') {
              if (stage === 1) {
                return {
                  durationSeconds: 1.35,
                  hitRadius: 13,
                  offsets: [
                    { forward: 14, lateral: 42 },
                    { forward: 14, lateral: -42 },
                    { forward: -6, lateral: 78 },
                    { forward: -6, lateral: -78 },
                  ],
                };
              }
              return {
                durationSeconds: 1.5,
                hitRadius: 13,
                offsets: [
                  { forward: 22, lateral: 36 },
                  { forward: 22, lateral: -36 },
                  { forward: 8, lateral: 70 },
                  { forward: 8, lateral: -70 },
                  { forward: -10, lateral: 104 },
                  { forward: -10, lateral: -104 },
                ],
              };
            }

            if (stage === 1) {
              return {
                durationSeconds: 1.35,
                hitRadius: 13,
                offsets: [
                  { forward: 42, lateral: 12 },
                  { forward: 78, lateral: -12 },
                ],
              };
            }

            return {
              durationSeconds: 1.5,
              hitRadius: 13,
              offsets: [
                { forward: 34, lateral: 10 },
                { forward: 72, lateral: 0 },
                { forward: 112, lateral: -10 },
              ],
            };
          }

          export function projectSplitEchoes(
            position: Point2D,
            velocity: Point2D,
            profile: SplitCastProfile,
          ): Point2D[] {
            const speed = Math.hypot(velocity.x, velocity.y);
            if (!(speed > 0)) return [];
            const forward = { x: velocity.x / speed, y: velocity.y / speed };
            const normal = { x: -forward.y, y: forward.x };
            return profile.offsets.map((offset) => ({
              x: position.x + forward.x * offset.forward + normal.x * offset.lateral,
              y: position.y + forward.y * offset.forward + normal.y * offset.lateral,
            }));
          }
          '''
          Path('rune-ball/src/progression/SplitEvolutionTuning.ts').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in split_tuning.splitlines()) + '\n')

          profile = r'''import type { SplitEvolutionPath, VortexEvolutionPath } from '../progression/RuneEvolutionCatalog';

          export interface PlayerProfile {
            vortexPath: VortexEvolutionPath;
            splitPath: SplitEvolutionPath;
          }

          const PROFILE_STORAGE_KEY = 'rune-ball:profile:v1';
          const DEFAULT_PROFILE: PlayerProfile = { vortexPath: 'gravity-well', splitPath: 'prism' };

          function isVortexPath(value: unknown): value is VortexEvolutionPath {
            return value === 'gravity-well' || value === 'orbit';
          }

          function isSplitPath(value: unknown): value is SplitEvolutionPath {
            return value === 'prism' || value === 'lance';
          }

          export function readPlayerProfile(storage: Storage | null): PlayerProfile {
            if (!storage) return { ...DEFAULT_PROFILE };

            try {
              const raw = storage.getItem(PROFILE_STORAGE_KEY);
              if (!raw) return { ...DEFAULT_PROFILE };
              const parsed = JSON.parse(raw) as { vortexPath?: unknown; splitPath?: unknown };
              return {
                vortexPath: isVortexPath(parsed.vortexPath) ? parsed.vortexPath : DEFAULT_PROFILE.vortexPath,
                splitPath: isSplitPath(parsed.splitPath) ? parsed.splitPath : DEFAULT_PROFILE.splitPath,
              };
            } catch {
              return { ...DEFAULT_PROFILE };
            }
          }

          export function writePlayerProfile(storage: Storage | null, profile: PlayerProfile): void {
            if (!storage) return;
            try {
              storage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(profile));
            } catch {
              // Storage can be unavailable in private/restricted browser contexts. Runtime remains usable.
            }
          }
          '''
          Path('rune-ball/src/profile/PlayerProfile.ts').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in profile.splitlines()) + '\n')

          # RuneSystem supports path-specific Split duration without owning evolution semantics.
          path = Path('rune-ball/src/rune/RuneSystem.ts')
          text = path.read_text()
          text = replace_once(text, 'export interface RuneActivationOptions {\n  vortexDurationSeconds?: number;\n}', 'export interface RuneActivationOptions {\n  vortexDurationSeconds?: number;\n  splitDurationSeconds?: number;\n}', 'Rune activation options')
          text = replace_once(text, '  private splitSecondsRemaining = 0;\n', '  private splitSecondsRemaining = 0;\n  private splitDurationSeconds = SPLIT_DURATION_SECONDS;\n', 'Split duration state')
          text = replace_once(text, '      splitStrength: this.clamp01(this.splitSecondsRemaining / SPLIT_DURATION_SECONDS),', '      splitStrength: this.clamp01(this.splitSecondsRemaining / this.splitDurationSeconds),', 'Split strength duration')
          text = replace_once(text, "      case 'split':\n        this.splitSecondsRemaining = SPLIT_DURATION_SECONDS;\n        break;", "      case 'split': {\n        const requestedDuration = options.splitDurationSeconds ?? SPLIT_DURATION_SECONDS;\n        this.splitDurationSeconds = Number.isFinite(requestedDuration)\n          ? Math.max(0.1, requestedDuration)\n          : SPLIT_DURATION_SECONDS;\n        this.splitSecondsRemaining = this.splitDurationSeconds;\n        break;\n      }", 'Split activation duration')
          path.write_text(text)

          # DestructionSession owns qualified-use causality and applies the active Split geometry.
          path = Path('rune-ball/src/game/DestructionSession.ts')
          text = path.read_text()
          text = replace_once(
              text,
              "import type { RuneKind } from '../rune/RuneTypes';",
              "import type { RuneKind } from '../rune/RuneTypes';\nimport {\n  SplitEvolutionSystem,\n  type SplitEvolutionPath,\n  type SplitEvolutionSnapshot,\n  type SplitEvolutionStage,\n} from '../progression/SplitEvolutionSystem';\nimport {\n  BASE_SPLIT_PROFILE,\n  getSplitCastProfile,\n  projectSplitEchoes,\n  type SplitCastProfile,\n} from '../progression/SplitEvolutionTuning';",
              'Split imports',
          )
          text = replace_once(
              text,
              "  | { type: 'vortex-collapse'; center: Point2D; targets: Point2D[] }",
              "  | { type: 'vortex-collapse'; center: Point2D; targets: Point2D[] }\n  | { type: 'split-evolution-progress'; path: SplitEvolutionPath; stage: SplitEvolutionStage; stageName: string; qualifiedUses: number; nextThreshold: number | null }\n  | { type: 'split-evolved'; path: SplitEvolutionPath; stage: 1 | 2; stageName: string; qualifiedUses: number; nextThreshold: number | null; center: Point2D }",
              'Split events',
          )
          text = replace_once(text, '  vortexEvolution: VortexEvolutionSnapshot;\n  splitEchoes: Point2D[];', '  vortexEvolution: VortexEvolutionSnapshot;\n  splitEvolution: SplitEvolutionSnapshot;\n  splitEchoes: Point2D[];', 'Split snapshot')
          text = replace_once(text, 'export interface DestructionSessionOptions {\n  vortexEvolutionPath?: VortexEvolutionPath;\n}', 'export interface DestructionSessionOptions {\n  vortexEvolutionPath?: VortexEvolutionPath;\n  splitEvolutionPath?: SplitEvolutionPath;\n}', 'Split session option')
          text = replace_once(text, 'const SPLIT_ECHO_OFFSET = 42;\nconst SPLIT_ECHO_RADIUS = 13;\n', '', 'Remove fixed Split geometry')
          text = replace_once(text, '  private readonly vortexEvolution: VortexEvolutionSystem;\n', '  private readonly vortexEvolution: VortexEvolutionSystem;\n  private readonly splitEvolution: SplitEvolutionSystem;\n', 'Split evolution field')
          text = replace_once(text, '  private activeVortexProfile: VortexCastProfile = BASE_VORTEX_PROFILE;\n', '  private activeVortexProfile: VortexCastProfile = BASE_VORTEX_PROFILE;\n  private activeSplitProfile: SplitCastProfile = BASE_SPLIT_PROFILE;\n  private splitCastQualified = false;\n', 'Split active profile')
          text = replace_once(text, "    this.vortexEvolution = new VortexEvolutionSystem(options.vortexEvolutionPath ?? 'gravity-well');", "    this.vortexEvolution = new VortexEvolutionSystem(options.vortexEvolutionPath ?? 'gravity-well');\n    this.splitEvolution = new SplitEvolutionSystem(options.splitEvolutionPath ?? 'prism');", 'Split evolution init')
          text = replace_once(text, '      vortexEvolution: this.vortexEvolution.snapshot,\n      splitEchoes: runes.splitStrength > 0 ? this.splitEchoPositions(ball) : [],', '      vortexEvolution: this.vortexEvolution.snapshot,\n      splitEvolution: this.splitEvolution.snapshot,\n      splitEchoes: runes.splitStrength > 0 ? this.splitEchoPositions(ball, this.activeSplitProfile) : [],', 'Split snapshot values')
          text = replace_once(
              text,
              "    const vortexProfile = rune === 'vortex' ? this.vortexProfileForCurrentStage() : BASE_VORTEX_PROFILE;\n    const result = this.runes.activate(\n      rune,\n      center,\n      rune === 'vortex' ? { vortexDurationSeconds: vortexProfile.durationSeconds } : {},\n    );",
              "    const vortexProfile = rune === 'vortex' ? this.vortexProfileForCurrentStage() : BASE_VORTEX_PROFILE;\n    const splitProfile = rune === 'split' ? this.splitProfileForCurrentStage() : BASE_SPLIT_PROFILE;\n    const activationOptions = rune === 'vortex'\n      ? { vortexDurationSeconds: vortexProfile.durationSeconds }\n      : rune === 'split'\n        ? { splitDurationSeconds: splitProfile.durationSeconds }\n        : {};\n    const result = this.runes.activate(rune, center, activationOptions);",
              'Split activation profile',
          )
          text = replace_once(text, '    if (rune === \'vortex\') this.activeVortexProfile = vortexProfile;\n', "    if (rune === 'vortex') this.activeVortexProfile = vortexProfile;\n    if (rune === 'split') {\n      this.activeSplitProfile = splitProfile;\n      this.splitCastQualified = false;\n    }\n", 'Split active cast state')
          text = replace_once(text, '      for (const echo of this.splitEchoPositions(this.ball.snapshot)) {\n        for (const targetId of this.targets.collidingTargetIds(echo, SPLIT_ECHO_RADIUS)) echoIds.add(targetId);\n', '      for (const echo of this.splitEchoPositions(this.ball.snapshot, this.activeSplitProfile)) {\n        for (const targetId of this.targets.collidingTargetIds(echo, this.activeSplitProfile.hitRadius)) echoIds.add(targetId);\n', 'Split collision geometry')
          text = replace_once(
              text,
              '    const hit = this.targets.hit(targetId);\n    if (!hit) return false;\n    const runeStateAtImpact = this.runes.snapshot;',
              "    const hit = this.targets.hit(targetId);\n    if (!hit) return false;\n\n    if (source === 'split' && !this.splitCastQualified) {\n      this.splitCastQualified = true;\n      const advance = this.splitEvolution.registerQualifiedUse();\n      const evolution = advance.snapshot;\n      events.push({\n        type: 'split-evolution-progress',\n        path: evolution.path,\n        stage: evolution.stage,\n        stageName: evolution.stageName,\n        qualifiedUses: evolution.qualifiedUses,\n        nextThreshold: evolution.nextThreshold,\n      });\n      if (advance.evolved && (evolution.stage === 1 || evolution.stage === 2)) {\n        events.push({\n          type: 'split-evolved',\n          path: evolution.path,\n          stage: evolution.stage,\n          stageName: evolution.stageName,\n          qualifiedUses: evolution.qualifiedUses,\n          nextThreshold: evolution.nextThreshold,\n          center: { ...this.ball.snapshot.position },\n        });\n      }\n    }\n\n    const runeStateAtImpact = this.runes.snapshot;",
              'Split qualified-use causality',
          )
          text = replace_once(text, '  private vortexProfileForCurrentStage(): VortexCastProfile {\n    const evolution = this.vortexEvolution.snapshot;\n    return getVortexCastProfile(evolution.path, evolution.stage);\n  }', "  private vortexProfileForCurrentStage(): VortexCastProfile {\n    const evolution = this.vortexEvolution.snapshot;\n    return getVortexCastProfile(evolution.path, evolution.stage);\n  }\n\n  private splitProfileForCurrentStage(): SplitCastProfile {\n    const evolution = this.splitEvolution.snapshot;\n    return getSplitCastProfile(evolution.path, evolution.stage);\n  }", 'Split profile helper')
          old_split_positions = '''  private splitEchoPositions(ball: BallSnapshot): Point2D[] {\n    const speed = Math.hypot(ball.velocity.x, ball.velocity.y);\n    if (!(speed > 0)) return [];\n    const normal = { x: -ball.velocity.y / speed, y: ball.velocity.x / speed };\n    return [\n      {\n        x: ball.position.x + normal.x * SPLIT_ECHO_OFFSET,\n        y: ball.position.y + normal.y * SPLIT_ECHO_OFFSET,\n      },\n      {\n        x: ball.position.x - normal.x * SPLIT_ECHO_OFFSET,\n        y: ball.position.y - normal.y * SPLIT_ECHO_OFFSET,\n      },\n    ];\n  }'''
          new_split_positions = '''  private splitEchoPositions(ball: BallSnapshot, profile: SplitCastProfile): Point2D[] {\n    return projectSplitEchoes(ball.position, ball.velocity, profile);\n  }'''
          text = replace_once(text, old_split_positions, new_split_positions, 'Split echo projection')
          path.write_text(text)

          # Scene passes the configured Split path and gives auto-evolution a world feedback beat.
          path = Path('rune-ball/src/presentation/DestructionScene.ts')
          text = path.read_text()
          text = replace_once(text, "import type { VortexEvolutionPath } from '../progression/VortexEvolutionSystem';", "import type { VortexEvolutionPath } from '../progression/VortexEvolutionSystem';\nimport type { SplitEvolutionPath } from '../progression/SplitEvolutionSystem';", 'Scene Split type import')
          text = replace_once(text, '  vortexEvolutionPath?: VortexEvolutionPath;\n}', '  vortexEvolutionPath?: VortexEvolutionPath;\n  splitEvolutionPath?: SplitEvolutionPath;\n}', 'Scene Split callback option')
          text = replace_once(text, '      vortexEvolutionPath: callbacks.vortexEvolutionPath,\n    });', '      vortexEvolutionPath: callbacks.vortexEvolutionPath,\n      splitEvolutionPath: callbacks.splitEvolutionPath,\n    });', 'Scene Split session option')
          text = replace_once(text, "      case 'vortex-collapse':\n        this.cameraFeedback.kick('chain', event.center, this.arenaCenter());", "      case 'split-evolution-progress':\n        break;\n      case 'split-evolved':\n        this.pushCapped(\n          this.runeConfirmations,\n          { rune: 'split', center: { ...event.center }, life: RUNE_CONFIRM_SECONDS * (event.stage === 2 ? 2 : 1.45), success: true },\n          MAX_RUNE_CONFIRMATIONS,\n        );\n        this.cameraFeedback.kick(event.stage === 2 ? 'chain' : 'break', event.center, this.arenaCenter());\n        this.audio.playRune('split');\n        break;\n      case 'vortex-collapse':\n        this.cameraFeedback.kick('chain', event.center, this.arenaCenter());", 'Scene Split evolution feedback')
          path.write_text(text)

          # Causality overlay reuses evolution grammar but keeps the Rune's own glyph semantics.
          path = Path('rune-ball/src/presentation/RuneCausalityOverlay.ts')
          text = path.read_text()
          text = replace_once(text, "      case 'vortex-evolved':\n        this.spawnEvolution(event.center, event.stage);\n        break;", "      case 'vortex-evolved':\n        this.spawnEvolution('vortex', event.center, event.stage);\n        break;\n      case 'split-evolved':\n        this.spawnEvolution('split', event.center, event.stage);\n        break;", 'Split causality event')
          text = replace_once(text, '  private spawnEvolution(point: Point2D, stage: 1 | 2): void {\n    const group = document.createElementNS(SVG_NS, \'g\');\n    group.dataset.rune = \'vortex\';', "  private spawnEvolution(rune: RuneKind, point: Point2D, stage: 1 | 2): void {\n    const group = document.createElementNS(SVG_NS, 'g');\n    group.dataset.rune = rune;", 'Generic evolution signature')
          text = replace_once(text, "    glyph.setAttribute('d', this.glyphPath('vortex', point, stage === 2 ? 34 : 27));", "    glyph.setAttribute('d', this.glyphPath(rune, point, stage === 2 ? 34 : 27));", 'Generic evolution glyph')
          path.write_text(text)

          # Product profile + shell expose Split as a persisted build choice.
          path = Path('rune-ball/src/presentation/GameShell.ts')
          text = path.read_text()
          text = replace_once(text, '  getVortexPathDefinition,\n  type VortexEvolutionPath,', '  getSplitPathDefinition,\n  getVortexPathDefinition,\n  type SplitEvolutionPath,\n  type VortexEvolutionPath,', 'GameShell Split catalog imports')
          text = replace_once(text, '  onVortexPathChange(path: VortexEvolutionPath): void;\n  onScreenChange(screen: AppScreen): void;', '  onVortexPathChange(path: VortexEvolutionPath): void;\n  onSplitPathChange(path: SplitEvolutionPath): void;\n  onScreenChange(screen: AppScreen): void;', 'GameShell Split callback')
          text = replace_once(text, '  private selectedPath: VortexEvolutionPath;\n', '  private selectedPath: VortexEvolutionPath;\n  private selectedSplitPath: SplitEvolutionPath;\n', 'GameShell Split state')
          text = replace_once(text, '  constructor(host: HTMLElement, selectedPath: VortexEvolutionPath, callbacks: GameShellCallbacks) {\n    this.selectedPath = selectedPath;\n', '  constructor(host: HTMLElement, selectedPath: VortexEvolutionPath, selectedSplitPath: SplitEvolutionPath, callbacks: GameShellCallbacks) {\n    this.selectedPath = selectedPath;\n    this.selectedSplitPath = selectedSplitPath;\n', 'GameShell constructor')
          text = replace_once(text, '  setVortexPath(path: VortexEvolutionPath): void {\n    this.selectedPath = path;\n    this.renderBuild();\n  }', '  setVortexPath(path: VortexEvolutionPath): void {\n    this.selectedPath = path;\n    this.renderBuild();\n  }\n\n  setSplitPath(path: SplitEvolutionPath): void {\n    this.selectedSplitPath = path;\n    this.renderBuild();\n  }', 'GameShell Split setter')
          text = replace_once(text, '    this.runeTree = new RuneTreePanel(body, this.selectedPath, {\n      onVortexPathChange: (path) => {\n        this.selectedPath = path;\n        this.renderBuild();\n        this.callbacks.onVortexPathChange(path);\n      },\n    });', "    this.runeTree = new RuneTreePanel(body, this.selectedPath, this.selectedSplitPath, {\n      onVortexPathChange: (path) => {\n        this.selectedPath = path;\n        this.renderBuild();\n        this.callbacks.onVortexPathChange(path);\n      },\n      onSplitPathChange: (path) => {\n        this.selectedSplitPath = path;\n        this.renderBuild();\n        this.callbacks.onSplitPathChange(path);\n      },\n    });", 'GameShell RuneTree constructor')
          text = replace_once(text, '    const path = getVortexPathDefinition(this.selectedPath);\n    const text = `○ ${path.tierOne.name} → ${path.tierTwo.name}`;', "    const vortexPath = getVortexPathDefinition(this.selectedPath);\n    const splitPath = getSplitPathDefinition(this.selectedSplitPath);\n    const text = `○ ${vortexPath.title} · V ${splitPath.title} · Z BASE`;", 'GameShell build summary')
          text = replace_once(text, '    this.runeTree?.setVortexPath(this.selectedPath);\n', '    this.runeTree?.setVortexPath(this.selectedPath);\n    this.runeTree?.setSplitPath(this.selectedSplitPath);\n', 'GameShell sync Split tree')
          path.write_text(text)

          rune_tree = r'''import {
            RUNE_TREE_ORDER,
            SPLIT_PATH_ORDER,
            VORTEX_PATH_ORDER,
            getRuneBaseDefinition,
            getSplitEvolutionNode,
            getSplitPathDefinition,
            getVortexEvolutionNode,
            getVortexPathDefinition,
            type RuneTreeId,
            type SplitEvolutionPath,
            type SplitEvolutionTier,
            type VortexEvolutionPath,
            type VortexEvolutionTier,
          } from '../progression/RuneEvolutionCatalog';
          import '../rune-tree.css';
          import '../rune-tree-refinement.css';

          type NodeSelection =
            | { kind: 'base'; rune: RuneTreeId }
            | { kind: 'vortex'; path: VortexEvolutionPath; tier: VortexEvolutionTier }
            | { kind: 'split'; path: SplitEvolutionPath; tier: SplitEvolutionTier };

          export interface RuneTreePanelCallbacks {
            onVortexPathChange(path: VortexEvolutionPath): void;
            onSplitPathChange(path: SplitEvolutionPath): void;
          }

          export class RuneTreePanel {
            private readonly root: HTMLElement;
            private readonly runeButtons = new Map<RuneTreeId, HTMLButtonElement>();
            private readonly treeMount: HTMLElement;
            private readonly detailMount: HTMLElement;
            private readonly callbacks: RuneTreePanelCallbacks;
            private readonly branchRoots = new Map<string, HTMLElement>();
            private readonly nodeButtons = new Map<string, HTMLButtonElement>();
            private selectedRune: RuneTreeId = 'vortex';
            private selectedVortexPath: VortexEvolutionPath;
            private selectedSplitPath: SplitEvolutionPath;
            private selectedNode: NodeSelection;

            constructor(
              host: HTMLElement,
              selectedVortexPath: VortexEvolutionPath,
              selectedSplitPath: SplitEvolutionPath,
              callbacks: RuneTreePanelCallbacks,
            ) {
              this.selectedVortexPath = selectedVortexPath;
              this.selectedSplitPath = selectedSplitPath;
              this.selectedNode = { kind: 'vortex', path: selectedVortexPath, tier: 2 };
              this.callbacks = callbacks;

              const root = document.createElement('section');
              root.className = 'rune-tree-workspace';
              root.setAttribute('aria-label', 'Rune evolution build');

              const selector = document.createElement('div');
              selector.className = 'rune-tree-selector';
              selector.setAttribute('role', 'group');
              selector.setAttribute('aria-label', 'Choose Rune');

              for (const runeId of RUNE_TREE_ORDER) {
                const definition = getRuneBaseDefinition(runeId);
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'rune-tree-rune-button';
                button.dataset.rune = runeId;
                button.dataset.status = definition.evolutionStatus;
                button.setAttribute('aria-pressed', 'false');

                const glyph = document.createElement('span');
                glyph.className = 'rune-tree-rune-glyph';
                glyph.textContent = definition.glyph;
                glyph.setAttribute('aria-hidden', 'true');

                const copy = document.createElement('span');
                copy.className = 'rune-tree-rune-copy';
                const name = document.createElement('strong');
                name.textContent = definition.name;
                const state = document.createElement('small');
                state.textContent = definition.evolutionStatus === 'authored' ? 'TREE' : 'BASE';
                copy.append(name, state);

                button.append(glyph, copy);
                button.addEventListener('click', () => this.selectRune(runeId));
                selector.append(button);
                this.runeButtons.set(runeId, button);
              }

              const treeMount = document.createElement('div');
              treeMount.className = 'rune-tree-canvas';

              const detailMount = document.createElement('div');
              detailMount.className = 'rune-tree-detail-mount';
              detailMount.setAttribute('aria-live', 'polite');

              root.append(selector, treeMount, detailMount);
              host.append(root);

              this.root = root;
              this.treeMount = treeMount;
              this.detailMount = detailMount;
              this.renderRune();
            }

            setVortexPath(path: VortexEvolutionPath): void {
              const changed = path !== this.selectedVortexPath;
              this.selectedVortexPath = path;
              if (changed && this.selectedRune === 'vortex') this.selectedNode = { kind: 'vortex', path, tier: 2 };
              this.syncAuthoredState();
              this.renderDetail();
            }

            setSplitPath(path: SplitEvolutionPath): void {
              const changed = path !== this.selectedSplitPath;
              this.selectedSplitPath = path;
              if (changed && this.selectedRune === 'split') this.selectedNode = { kind: 'split', path, tier: 2 };
              this.syncAuthoredState();
              this.renderDetail();
            }

            showConfiguredRune(): void {
              this.renderRune();
            }

            destroy(): void {
              this.root.remove();
            }

            private selectRune(runeId: RuneTreeId): void {
              if (this.selectedRune === runeId) return;
              this.selectedRune = runeId;
              if (runeId === 'vortex') this.selectedNode = { kind: 'vortex', path: this.selectedVortexPath, tier: 2 };
              else if (runeId === 'split') this.selectedNode = { kind: 'split', path: this.selectedSplitPath, tier: 2 };
              else this.selectedNode = { kind: 'base', rune: 'chain' };
              this.renderRune();
            }

            private renderRune(): void {
              for (const [runeId, button] of this.runeButtons) {
                button.setAttribute('aria-pressed', String(runeId === this.selectedRune));
              }

              this.branchRoots.clear();
              this.nodeButtons.clear();
              this.treeMount.replaceChildren();

              if (this.selectedRune === 'vortex') this.renderVortexTree();
              else if (this.selectedRune === 'split') this.renderSplitTree();
              else this.renderFutureRune();

              this.renderDetail();
            }

            private makeBaseNode(rune: RuneTreeId): HTMLButtonElement {
              const baseNode = document.createElement('button');
              baseNode.type = 'button';
              baseNode.className = 'rune-tree-node rune-tree-base-node';
              baseNode.dataset.node = `${rune}-base`;
              baseNode.setAttribute('aria-pressed', String(this.selectedNode.kind === 'base' && this.selectedNode.rune === rune));
              baseNode.setAttribute('aria-label', `Base ${getRuneBaseDefinition(rune).name}`);
              baseNode.append(this.makeBaseEffect(rune));
              baseNode.addEventListener('click', () => {
                this.selectedNode = { kind: 'base', rune };
                this.syncNodeSelection();
                this.renderDetail();
              });
              this.nodeButtons.set(`${rune}:base`, baseNode);
              return baseNode;
            }

            private renderVortexTree(): void {
              const graph = document.createElement('div');
              graph.className = 'rune-tree-graph';
              const baseNode = this.makeBaseNode('vortex');
              const branches = document.createElement('div');
              branches.className = 'rune-tree-branch-grid';

              for (const path of VORTEX_PATH_ORDER) {
                const branch = this.makeBranch('vortex', path, path === this.selectedVortexPath);
                branch.append(
                  this.makePathMark(path),
                  this.makeVortexEvolutionNode(path, 1),
                  this.makeRail(),
                  this.makeVortexEvolutionNode(path, 2),
                );
                branches.append(branch);
              }

              graph.append(baseNode, branches);
              this.treeMount.append(graph);
              this.syncAuthoredState();
            }

            private renderSplitTree(): void {
              const graph = document.createElement('div');
              graph.className = 'rune-tree-graph';
              const baseNode = this.makeBaseNode('split');
              const branches = document.createElement('div');
              branches.className = 'rune-tree-branch-grid';

              for (const path of SPLIT_PATH_ORDER) {
                const branch = this.makeBranch('split', path, path === this.selectedSplitPath);
                branch.append(
                  this.makePathMark(path),
                  this.makeSplitEvolutionNode(path, 1),
                  this.makeRail(),
                  this.makeSplitEvolutionNode(path, 2),
                );
                branches.append(branch);
              }

              graph.append(baseNode, branches);
              this.treeMount.append(graph);
              this.syncAuthoredState();
            }

            private makeBranch(rune: 'vortex' | 'split', path: string, equipped: boolean): HTMLElement {
              const branch = document.createElement('section');
              branch.className = 'rune-tree-branch';
              branch.dataset.path = path;
              branch.dataset.equipped = String(equipped);
              this.branchRoots.set(`${rune}:${path}`, branch);
              return branch;
            }

            private makePathMark(path: string): HTMLElement {
              const mark = document.createElement('span');
              mark.className = `rune-tree-path-mark rune-tree-path-mark--${path}`;
              mark.setAttribute('aria-hidden', 'true');
              return mark;
            }

            private makeRail(): HTMLElement {
              const rail = document.createElement('span');
              rail.className = 'rune-tree-rail';
              rail.setAttribute('aria-hidden', 'true');
              return rail;
            }

            private makeVortexEvolutionNode(path: VortexEvolutionPath, tier: VortexEvolutionTier): HTMLButtonElement {
              const node = getVortexEvolutionNode(path, tier);
              return this.makeEvolutionButton(
                `vortex:${path}:${tier}`,
                path,
                tier,
                node.name,
                node.threshold,
                'Vortex',
                () => {
                  if (path !== this.selectedVortexPath) {
                    this.selectedVortexPath = path;
                    this.callbacks.onVortexPathChange(path);
                  }
                  this.selectedNode = { kind: 'vortex', path, tier };
                },
              );
            }

            private makeSplitEvolutionNode(path: SplitEvolutionPath, tier: SplitEvolutionTier): HTMLButtonElement {
              const node = getSplitEvolutionNode(path, tier);
              return this.makeEvolutionButton(
                `split:${path}:${tier}`,
                path,
                tier,
                node.name,
                node.threshold,
                'Split',
                () => {
                  if (path !== this.selectedSplitPath) {
                    this.selectedSplitPath = path;
                    this.callbacks.onSplitPathChange(path);
                  }
                  this.selectedNode = { kind: 'split', path, tier };
                },
              );
            }

            private makeEvolutionButton(
              key: string,
              path: string,
              tier: 1 | 2,
              name: string,
              threshold: number,
              runeName: string,
              select: () => void,
            ): HTMLButtonElement {
              const button = document.createElement('button');
              button.type = 'button';
              button.className = 'rune-tree-node rune-tree-evolution-node';
              button.dataset.path = path;
              button.dataset.tier = String(tier);
              button.setAttribute('aria-pressed', 'false');
              button.setAttribute('aria-label', `Tier ${tier} ${name}. Auto evolves at ${threshold} qualified ${runeName} uses.`);

              const sigil = document.createElement('span');
              sigil.className = `rune-tree-node-sigil rune-tree-node-sigil--${path} rune-tree-node-sigil--tier-${tier}`;
              sigil.setAttribute('aria-hidden', 'true');
              const core = document.createElement('span');
              core.className = 'rune-tree-node-sigil-core';
              sigil.append(core);
              button.append(sigil);

              button.addEventListener('click', () => {
                select();
                this.syncAuthoredState();
                this.renderDetail();
              });

              this.nodeButtons.set(key, button);
              return button;
            }

            private renderFutureRune(): void {
              const graph = document.createElement('div');
              graph.className = 'rune-tree-graph rune-tree-graph-future';

              const baseNode = document.createElement('div');
              baseNode.className = 'rune-tree-node rune-tree-base-node rune-tree-future-base';
              baseNode.append(this.makeBaseEffect(this.selectedRune));

              const branches = document.createElement('div');
              branches.className = 'rune-tree-branch-grid rune-tree-future-branches';
              for (let index = 0; index < 2; index += 1) {
                const branch = document.createElement('div');
                branch.className = 'rune-tree-branch rune-tree-future-branch';
                branch.innerHTML = [
                  '<span class="rune-tree-future-path-mark" aria-hidden="true"></span>',
                  '<div class="rune-tree-node rune-tree-future-node"><span class="rune-tree-future-node-mark" aria-hidden="true"></span></div>',
                  '<span class="rune-tree-rail" aria-hidden="true"></span>',
                  '<div class="rune-tree-node rune-tree-future-node"><span class="rune-tree-future-node-mark rune-tree-future-node-mark--final" aria-hidden="true"></span></div>',
                ].join('');
                branches.append(branch);
              }

              graph.append(baseNode, branches);
              this.treeMount.append(graph);
            }

            private makeBaseEffect(runeId: RuneTreeId): HTMLElement {
              const effect = document.createElement('span');
              effect.className = `rune-tree-base-effect rune-tree-base-effect--${runeId}`;
              effect.setAttribute('aria-hidden', 'true');

              for (const part of ['core', 'accent-a', 'accent-b']) {
                const element = document.createElement('span');
                element.className = `rune-tree-base-effect-${part}`;
                effect.append(element);
              }
              return effect;
            }

            private renderDetail(): void {
              this.detailMount.replaceChildren();
              const base = getRuneBaseDefinition(this.selectedRune);

              if (this.selectedNode.kind === 'base') {
                this.detailMount.append(this.makeDetailCard({
                  eyebrow: `BASE RUNE · ${base.role}`,
                  title: base.name,
                  description: base.description,
                  playPattern: base.playPattern,
                  trigger: base.evolutionStatus === 'authored'
                    ? `EVOLUTION BEGINS FROM QUALIFIED ${base.name} USES`
                    : 'EVOLUTION TREE · NOT YET AUTHORED',
                }));
                return;
              }

              if (this.selectedNode.kind === 'vortex') {
                const path = getVortexPathDefinition(this.selectedNode.path);
                const node = getVortexEvolutionNode(this.selectedNode.path, this.selectedNode.tier);
                this.detailMount.append(this.makeEvolutionDetail(path.title, node.tier, node.name, node.description, node.playPattern, node.threshold, 'VORTEX'));
                return;
              }

              const path = getSplitPathDefinition(this.selectedNode.path);
              const node = getSplitEvolutionNode(this.selectedNode.path, this.selectedNode.tier);
              this.detailMount.append(this.makeEvolutionDetail(path.title, node.tier, node.name, node.description, node.playPattern, node.threshold, 'SPLIT'));
            }

            private makeEvolutionDetail(
              pathTitle: string,
              tier: 1 | 2,
              name: string,
              description: string,
              playPattern: string,
              threshold: number,
              runeName: string,
            ): HTMLElement {
              const card = this.makeDetailCard({
                eyebrow: `T${tier} · ${pathTitle} PATH`,
                title: name,
                description,
                playPattern,
                trigger: `AUTO-EVOLVE · ${threshold} QUALIFIED ${runeName} USES`,
              });
              const active = document.createElement('span');
              active.className = 'rune-tree-detail-active';
              active.textContent = `${pathTitle} PATH ACTIVE`;
              card.append(active);
              return card;
            }

            private makeDetailCard(copy: {
              eyebrow: string;
              title: string;
              description: string;
              playPattern: string;
              trigger: string;
            }): HTMLElement {
              const card = document.createElement('section');
              card.className = 'rune-tree-detail';
              const eyebrow = document.createElement('span');
              eyebrow.className = 'rune-tree-detail-eyebrow';
              eyebrow.textContent = copy.eyebrow;
              const title = document.createElement('h2');
              title.textContent = copy.title;
              const description = document.createElement('p');
              description.textContent = copy.description;
              const pattern = document.createElement('div');
              pattern.className = 'rune-tree-pattern';
              const patternLabel = document.createElement('span');
              patternLabel.textContent = 'PLAY PATTERN';
              const patternValue = document.createElement('strong');
              patternValue.textContent = copy.playPattern;
              pattern.append(patternLabel, patternValue);
              const trigger = document.createElement('span');
              trigger.className = 'rune-tree-trigger';
              trigger.textContent = copy.trigger;
              card.append(eyebrow, title, description, pattern, trigger);
              return card;
            }

            private syncAuthoredState(): void {
              if (this.selectedRune === 'vortex') {
                for (const path of VORTEX_PATH_ORDER) {
                  const branch = this.branchRoots.get(`vortex:${path}`);
                  if (branch) branch.dataset.equipped = String(path === this.selectedVortexPath);
                }
              } else if (this.selectedRune === 'split') {
                for (const path of SPLIT_PATH_ORDER) {
                  const branch = this.branchRoots.get(`split:${path}`);
                  if (branch) branch.dataset.equipped = String(path === this.selectedSplitPath);
                }
              }
              this.syncNodeSelection();
            }

            private syncNodeSelection(): void {
              for (const [key, button] of this.nodeButtons) {
                const selected = this.selectedNode.kind === 'base'
                  ? key === `${this.selectedNode.rune}:base`
                  : this.selectedNode.kind === 'vortex'
                    ? key === `vortex:${this.selectedNode.path}:${this.selectedNode.tier}`
                    : key === `split:${this.selectedNode.path}:${this.selectedNode.tier}`;
                button.setAttribute('aria-pressed', String(selected));
              }
            }
          }
          '''
          Path('rune-ball/src/presentation/RuneTreePanel.ts').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in rune_tree.splitlines()) + '\n')

          # Add Split visual grammar to the existing glyph-first tree.
          path = Path('rune-ball/src/rune-tree-refinement.css')
          text = path.read_text()
          text += r'''

/* P8.3 — Split branch symbols describe attack geometry, not the V gesture. */
.rune-tree-path-mark--prism::after,
.rune-tree-path-mark--lance::after {
  position: absolute;
  content: '';
}

.rune-tree-path-mark--prism::after {
  inset: 3px;
  border: 1px solid var(--rb-cyan);
  transform: rotate(45deg);
}

.rune-tree-path-mark--lance::after {
  top: 2px;
  left: 6px;
  width: 1px;
  height: 9px;
  background: var(--rb-magenta);
  box-shadow: 0 0 7px rgb(215 86 255 / 48%);
}

.rune-tree-node-sigil--prism::before,
.rune-tree-node-sigil--prism::after {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 32px;
  height: 1.5px;
  background: rgb(111 233 255 / 72%);
  content: '';
  transform-origin: left center;
}

.rune-tree-node-sigil--prism::before {
  transform: translate(-1px, -1px) rotate(-31deg);
}

.rune-tree-node-sigil--prism::after {
  transform: translate(-1px, -1px) rotate(31deg);
}

.rune-tree-node-sigil--prism .rune-tree-node-sigil-core {
  top: 50%;
  left: 50%;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--rb-white, #f0fbff);
  box-shadow: 0 0 12px rgb(111 233 255 / 62%);
  transform: translate(-50%, -50%) rotate(45deg);
}

.rune-tree-node-sigil--prism.rune-tree-node-sigil--tier-2 {
  box-shadow: inset 0 0 14px rgb(111 233 255 / 10%);
}

.rune-tree-node-sigil--prism.rune-tree-node-sigil--tier-2::before {
  width: 39px;
  box-shadow: 0 10px 0 -0.5px rgb(215 86 255 / 58%);
}

.rune-tree-node-sigil--prism.rune-tree-node-sigil--tier-2::after {
  width: 39px;
  box-shadow: 0 -10px 0 -0.5px rgb(215 86 255 / 58%);
}

.rune-tree-node-sigil--lance::before {
  position: absolute;
  top: 8px;
  left: 50%;
  width: 2px;
  height: 38px;
  background: linear-gradient(to bottom, var(--rb-cyan), var(--rb-magenta));
  box-shadow: 0 0 9px rgb(111 233 255 / 40%);
  content: '';
  transform: translateX(-50%);
}

.rune-tree-node-sigil--lance::after {
  position: absolute;
  top: 6px;
  left: 50%;
  width: 10px;
  height: 10px;
  border-top: 2px solid var(--rb-cyan);
  border-left: 2px solid var(--rb-cyan);
  content: '';
  transform: translateX(-50%) rotate(45deg);
}

.rune-tree-node-sigil--lance .rune-tree-node-sigil-core {
  bottom: 8px;
  left: 50%;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--rb-magenta);
  box-shadow: 0 0 10px rgb(215 86 255 / 52%);
  transform: translateX(-50%);
}

.rune-tree-node-sigil--lance.rune-tree-node-sigil--tier-2::before {
  top: 3px;
  height: 47px;
  width: 3px;
}

.rune-tree-node-sigil--lance.rune-tree-node-sigil--tier-2::after {
  top: 2px;
  width: 13px;
  height: 13px;
}
'''
          path.write_text(text)

          evolution_status = r'''import type { DestructionEvent } from '../game/DestructionSession';
          import {
            SPLIT_TIER_ONE_THRESHOLD,
            VORTEX_TIER_ONE_THRESHOLD,
            getRuneBaseDefinition,
            getSplitPathDefinition,
            getVortexPathDefinition,
            type SplitEvolutionPath,
            type VortexEvolutionPath,
          } from '../progression/RuneEvolutionCatalog';

          interface EvolutionDisplayState {
            stage: 0 | 1 | 2;
            stageName: string;
            qualifiedUses: number;
            nextThreshold: number | null;
            finalStageName: string;
          }

          export class RuneEvolutionStatus {
            private readonly root: HTMLElement;
            private readonly glyph: HTMLElement;
            private readonly stage: HTMLElement;
            private readonly progress: HTMLElement;
            private vortexPath: VortexEvolutionPath;
            private splitPath: SplitEvolutionPath;
            private vortexState: EvolutionDisplayState;
            private splitState: EvolutionDisplayState;
            private activeRune: 'vortex' | 'split' = 'vortex';
            private flashTimer: number | null = null;

            constructor(host: HTMLElement, vortexPath: VortexEvolutionPath, splitPath: SplitEvolutionPath) {
              this.vortexPath = vortexPath;
              this.splitPath = splitPath;
              this.vortexState = this.initialVortexState();
              this.splitState = this.initialSplitState();

              const root = document.createElement('div');
              root.className = 'rune-evolution-status';
              root.setAttribute('aria-live', 'polite');

              const glyph = document.createElement('span');
              glyph.className = 'rune-evolution-glyph';

              const copy = document.createElement('span');
              copy.className = 'rune-evolution-copy';
              const stage = document.createElement('strong');
              stage.className = 'rune-evolution-stage';
              const progress = document.createElement('span');
              progress.className = 'rune-evolution-progress';
              copy.append(stage, progress);
              root.append(glyph, copy);
              host.append(root);

              this.root = root;
              this.glyph = glyph;
              this.stage = stage;
              this.progress = progress;
              this.render('vortex');
            }

            reset(vortexPath: VortexEvolutionPath, splitPath: SplitEvolutionPath): void {
              this.vortexPath = vortexPath;
              this.splitPath = splitPath;
              this.vortexState = this.initialVortexState();
              this.splitState = this.initialSplitState();
              this.activeRune = 'vortex';
              this.root.classList.remove('is-evolving');
              if (this.flashTimer !== null) window.clearTimeout(this.flashTimer);
              this.flashTimer = null;
              this.render('vortex');
            }

            handle(event: DestructionEvent): void {
              if (event.type === 'vortex-evolution-progress' || event.type === 'vortex-evolved') {
                this.vortexPath = event.path;
                this.vortexState = {
                  stage: event.stage,
                  stageName: event.stageName,
                  qualifiedUses: event.qualifiedUses,
                  nextThreshold: event.nextThreshold,
                  finalStageName: getVortexPathDefinition(event.path).tierTwo.name,
                };
                this.render('vortex');
                if (event.type === 'vortex-evolved') this.flashEvolution();
                return;
              }

              if (event.type === 'split-evolution-progress' || event.type === 'split-evolved') {
                this.splitPath = event.path;
                this.splitState = {
                  stage: event.stage,
                  stageName: event.stageName,
                  qualifiedUses: event.qualifiedUses,
                  nextThreshold: event.nextThreshold,
                  finalStageName: getSplitPathDefinition(event.path).tierTwo.name,
                };
                this.render('split');
                if (event.type === 'split-evolved') this.flashEvolution();
              }
            }

            setVisible(visible: boolean): void {
              this.root.hidden = !visible;
            }

            destroy(): void {
              if (this.flashTimer !== null) window.clearTimeout(this.flashTimer);
              this.root.remove();
            }

            private initialVortexState(): EvolutionDisplayState {
              return {
                stage: 0,
                stageName: getRuneBaseDefinition('vortex').name,
                qualifiedUses: 0,
                nextThreshold: VORTEX_TIER_ONE_THRESHOLD,
                finalStageName: getVortexPathDefinition(this.vortexPath).tierTwo.name,
              };
            }

            private initialSplitState(): EvolutionDisplayState {
              return {
                stage: 0,
                stageName: getRuneBaseDefinition('split').name,
                qualifiedUses: 0,
                nextThreshold: SPLIT_TIER_ONE_THRESHOLD,
                finalStageName: getSplitPathDefinition(this.splitPath).tierTwo.name,
              };
            }

            private render(rune: 'vortex' | 'split'): void {
              this.activeRune = rune;
              const state = rune === 'vortex' ? this.vortexState : this.splitState;
              this.root.dataset.rune = rune;
              this.root.dataset.stage = String(state.stage);
              this.glyph.textContent = getRuneBaseDefinition(rune).glyph;
              this.stage.textContent = state.stageName;
              this.progress.textContent = state.nextThreshold === null
                ? 'MAX EVOLUTION'
                : `${state.qualifiedUses}/${state.nextThreshold} → ${state.finalStageName}`;
            }

            private flashEvolution(): void {
              this.root.classList.remove('is-evolving');
              void this.root.offsetWidth;
              this.root.classList.add('is-evolving');
              if (this.flashTimer !== null) window.clearTimeout(this.flashTimer);
              this.flashTimer = window.setTimeout(() => {
                this.root.classList.remove('is-evolving');
                this.flashTimer = null;
              }, 900);
            }
          }
          '''
          Path('rune-ball/src/presentation/RuneEvolutionStatus.ts').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in evolution_status.splitlines()) + '\n')
          Path('rune-ball/src/presentation/VortexEvolutionStatus.ts').unlink()

          evolution_css = Path('rune-ball/src/evolution.css').read_text()
          evolution_css = evolution_css.replace('vortex-evolution-', 'rune-evolution-').replace('vortex-evolution-status', 'rune-evolution-status').replace('@keyframes vortex-evolution-flash', '@keyframes rune-evolution-flash').replace('animation: vortex-evolution-flash', 'animation: rune-evolution-flash')
          evolution_css += r'''

.rune-evolution-status[data-rune='split'] .rune-evolution-glyph {
  border-radius: 11px;
  color: #d756ff;
  border-color: rgb(215 86 255 / 34%);
}
'''
          Path('rune-ball/src/evolution.css').write_text(evolution_css)

          # Main application owns both persisted paths; one compact status follows whichever authored Rune just progressed.
          path = Path('rune-ball/src/main.ts')
          text = path.read_text()
          text = replace_once(text, "import type { VortexEvolutionPath } from './progression/VortexEvolutionSystem';", "import type { SplitEvolutionPath } from './progression/SplitEvolutionSystem';\nimport type { VortexEvolutionPath } from './progression/VortexEvolutionSystem';", 'Main Split type import')
          text = replace_once(text, "import { VortexEvolutionStatus } from './presentation/VortexEvolutionStatus';", "import { RuneEvolutionStatus } from './presentation/RuneEvolutionStatus';", 'Main evolution status import')
          text = replace_once(text, '  let selectedPath: VortexEvolutionPath = profile.vortexPath;\n', '  let selectedPath: VortexEvolutionPath = profile.vortexPath;\n  let selectedSplitPath: SplitEvolutionPath = profile.splitPath;\n', 'Main Split state')
          text = replace_once(text, '  let evolutionStatus: VortexEvolutionStatus | null = null;\n', '  let evolutionStatus: RuneEvolutionStatus | null = null;\n', 'Main status type')
          text = replace_once(text, '      { onGameplayEvent, vortexEvolutionPath: selectedPath },', '      { onGameplayEvent, vortexEvolutionPath: selectedPath, splitEvolutionPath: selectedSplitPath },', 'Main Scene Split option')
          text = replace_once(text, '    evolutionStatus.reset(selectedPath);\n', '    evolutionStatus.reset(selectedPath, selectedSplitPath);\n', 'Main status reset')
          text = replace_once(text, '    evolutionStatus = new VortexEvolutionStatus(host, selectedPath);\n', '    evolutionStatus = new RuneEvolutionStatus(host, selectedPath, selectedSplitPath);\n', 'Main status constructor')
          text = replace_once(text, '    console.info(`[Rune Ball] Loading stage ${stageId} with Vortex path ${selectedPath}.`);', '    console.info(`[Rune Ball] Loading stage ${stageId} with Vortex ${selectedPath} / Split ${selectedSplitPath}.`);', 'Main stage log')
          text = replace_once(text, '  shell = new GameShell(host, selectedPath, {', '  shell = new GameShell(host, selectedPath, selectedSplitPath, {', 'Main GameShell constructor')
          text = replace_once(text, '    onVortexPathChange: (path) => {\n      selectedPath = path;\n      profile = { ...profile, vortexPath: path };\n      persistProfile();\n    },', "    onVortexPathChange: (path) => {\n      selectedPath = path;\n      profile = { ...profile, vortexPath: path };\n      persistProfile();\n    },\n    onSplitPathChange: (path) => {\n      selectedSplitPath = path;\n      profile = { ...profile, splitPath: path };\n      persistProfile();\n    },", 'Main Split profile callback')
          path.write_text(text)

          # Tests: catalog, profile, evolution thresholds, and attack geometry.
          Path('rune-ball/tests/rune-evolution-catalog.test.ts').write_text(r'''import { describe, expect, it } from 'vitest';
          import {
            RUNE_BASE_DEFINITIONS,
            RUNE_TREE_ORDER,
            SPLIT_EVOLUTION_PATHS,
            SPLIT_TIER_ONE_THRESHOLD,
            SPLIT_TIER_TWO_THRESHOLD,
            VORTEX_EVOLUTION_PATHS,
            VORTEX_TIER_ONE_THRESHOLD,
            VORTEX_TIER_TWO_THRESHOLD,
            getSplitEvolutionStageName,
            getVortexEvolutionStageName,
          } from '../src/progression/RuneEvolutionCatalog';

          describe('RuneEvolutionCatalog', () => {
            it('keeps Vortex and Split authored while Chain remains the next future tree', () => {
              expect(RUNE_TREE_ORDER).toEqual(['vortex', 'split', 'chain']);
              expect(RUNE_BASE_DEFINITIONS.vortex.evolutionStatus).toBe('authored');
              expect(RUNE_BASE_DEFINITIONS.split.evolutionStatus).toBe('authored');
              expect(RUNE_BASE_DEFINITIONS.chain.evolutionStatus).toBe('future');
            });

            it('uses deliberate 3 then 6 qualified-use thresholds for authored Rune trees', () => {
              expect(VORTEX_TIER_ONE_THRESHOLD).toBe(3);
              expect(VORTEX_TIER_TWO_THRESHOLD).toBe(6);
              expect(SPLIT_TIER_ONE_THRESHOLD).toBe(3);
              expect(SPLIT_TIER_TWO_THRESHOLD).toBe(6);
              for (const path of Object.values(VORTEX_EVOLUTION_PATHS)) {
                expect(path.tierOne.threshold).toBe(3);
                expect(path.tierTwo.threshold).toBe(6);
              }
              for (const path of Object.values(SPLIT_EVOLUTION_PATHS)) {
                expect(path.tierOne.threshold).toBe(3);
                expect(path.tierTwo.threshold).toBe(6);
              }
            });

            it('maps runtime stage names from the same catalog shown in the Rune Tree', () => {
              expect(getVortexEvolutionStageName('gravity-well', 2)).toBe('SINGULARITY');
              expect(getVortexEvolutionStageName('orbit', 2)).toBe('EVENT HORIZON');
              expect(getSplitEvolutionStageName('prism', 0)).toBe('SPLIT');
              expect(getSplitEvolutionStageName('prism', 1)).toBe('REFRACTION');
              expect(getSplitEvolutionStageName('prism', 2)).toBe('AURORA PRISM');
              expect(getSplitEvolutionStageName('lance', 1)).toBe('CONVERGENCE');
              expect(getSplitEvolutionStageName('lance', 2)).toBe('VOID LANCE');
            });

            it('keeps Split branches behaviorally opposed rather than stat-only variants', () => {
              expect(SPLIT_EVOLUTION_PATHS.prism.identity).toBe('COVERAGE / SPREAD');
              expect(SPLIT_EVOLUTION_PATHS.lance.identity).toBe('FOCUS / PIERCE');
              expect(SPLIT_EVOLUTION_PATHS.prism.tierTwo.playPattern).toContain('sweep');
              expect(SPLIT_EVOLUTION_PATHS.lance.tierTwo.playPattern).toContain('pierce');
            });
          });
          '''.replace('          ', ''))

          Path('rune-ball/tests/player-profile.test.ts').write_text(r'''import { describe, expect, it } from 'vitest';
          import { readPlayerProfile, writePlayerProfile } from '../src/profile/PlayerProfile';

          function memoryStorage(): Storage {
            const data = new Map<string, string>();
            return {
              get length() { return data.size; },
              clear: () => data.clear(),
              getItem: (key) => data.get(key) ?? null,
              key: (index) => [...data.keys()][index] ?? null,
              removeItem: (key) => { data.delete(key); },
              setItem: (key, value) => { data.set(key, value); },
            };
          }

          describe('PlayerProfile', () => {
            it('defaults to Gravity + Prism while preserving old-profile compatibility', () => {
              expect(readPlayerProfile(null)).toEqual({ vortexPath: 'gravity-well', splitPath: 'prism' });
              const storage = memoryStorage();
              storage.setItem('rune-ball:profile:v1', JSON.stringify({ vortexPath: 'orbit' }));
              expect(readPlayerProfile(storage)).toEqual({ vortexPath: 'orbit', splitPath: 'prism' });
            });

            it('persists selected Vortex and Split evolution paths', () => {
              const storage = memoryStorage();
              writePlayerProfile(storage, { vortexPath: 'orbit', splitPath: 'lance' });
              expect(readPlayerProfile(storage)).toEqual({ vortexPath: 'orbit', splitPath: 'lance' });
            });

            it('falls back per-field when stored profile data is invalid', () => {
              const storage = memoryStorage();
              storage.setItem('rune-ball:profile:v1', JSON.stringify({ vortexPath: 'unknown', splitPath: 'unknown' }));
              expect(readPlayerProfile(storage)).toEqual({ vortexPath: 'gravity-well', splitPath: 'prism' });
            });
          });
          '''.replace('          ', ''))

          Path('rune-ball/tests/split-evolution-system.test.ts').write_text(r'''import { describe, expect, it } from 'vitest';
          import { SplitEvolutionSystem } from '../src/progression/SplitEvolutionSystem';

          describe('SplitEvolutionSystem', () => {
            it('auto-evolves Prism at 3 and 6 qualified Split uses', () => {
              const system = new SplitEvolutionSystem('prism');
              expect(system.snapshot.stageName).toBe('SPLIT');
              for (let index = 0; index < 2; index += 1) expect(system.registerQualifiedUse().evolved).toBe(false);
              expect(system.registerQualifiedUse().snapshot).toMatchObject({ stage: 1, stageName: 'REFRACTION', qualifiedUses: 3 });
              for (let index = 0; index < 2; index += 1) system.registerQualifiedUse();
              expect(system.registerQualifiedUse().snapshot).toMatchObject({ stage: 2, stageName: 'AURORA PRISM', qualifiedUses: 6, nextThreshold: null });
            });

            it('uses the selected Lance path without changing the progression contract', () => {
              const system = new SplitEvolutionSystem('lance');
              for (let index = 0; index < 3; index += 1) system.registerQualifiedUse();
              expect(system.snapshot).toMatchObject({ path: 'lance', stage: 1, stageName: 'CONVERGENCE' });
            });
          });
          '''.replace('          ', ''))

          Path('rune-ball/tests/split-evolution-tuning.test.ts').write_text(r'''import { describe, expect, it } from 'vitest';
          import { BASE_SPLIT_PROFILE, getSplitCastProfile, projectSplitEchoes } from '../src/progression/SplitEvolutionTuning';

          describe('SplitEvolutionTuning', () => {
            it('turns Prism into progressively wider attack coverage', () => {
              const t1 = getSplitCastProfile('prism', 1);
              const t2 = getSplitCastProfile('prism', 2);
              expect(BASE_SPLIT_PROFILE.offsets).toHaveLength(2);
              expect(t1.offsets).toHaveLength(4);
              expect(t2.offsets).toHaveLength(6);
              expect(Math.max(...t2.offsets.map((offset) => Math.abs(offset.lateral)))).toBeGreaterThan(100);
            });

            it('turns Lance into a forward-axis pressure column', () => {
              const t1 = getSplitCastProfile('lance', 1);
              const t2 = getSplitCastProfile('lance', 2);
              expect(t1.offsets.every((offset) => Math.abs(offset.lateral) <= 12)).toBe(true);
              expect(t2.offsets.every((offset) => Math.abs(offset.lateral) <= 10)).toBe(true);
              expect(Math.max(...t2.offsets.map((offset) => offset.forward))).toBeGreaterThan(100);
            });

            it('projects the same profile relative to the current ball travel direction', () => {
              const echoes = projectSplitEchoes({ x: 100, y: 100 }, { x: 10, y: 0 }, getSplitCastProfile('lance', 2));
              expect(echoes).toHaveLength(3);
              expect(echoes.every((point) => point.x > 100)).toBe(true);
              expect(echoes.map((point) => point.y)).toEqual([110, 100, 90]);
            });
          });
          '''.replace('          ', ''))

          # README + milestone doc.
          path = Path('rune-ball/README.md')
          text = path.read_text()
          text = replace_once(text, '**P8.2.2 — Runtime Readability Refinement**', '**P8.3 — Split Evolution Gate**', 'README milestone')
          text = replace_once(text, '- **Split / Chain** remain selectable Base Runes with intentionally unauthored graphical branch placeholders rather than fake unlock content.', '- **Split** now supports `Prism → Refraction → Aurora Prism` and `Lance → Convergence → Void Lance`; only echo-caused target contact counts as a qualified Split use. **Chain** remains the intentionally unauthored next tree.', 'README Split contract')
          text = replace_once(text, 'Rune names, Vortex path identities, evolution thresholds, node descriptions, runtime stage names, and build summaries share `RuneEvolutionCatalog`. Vortex field tuning is isolated in `VortexEvolutionTuning`, while `ArenaLayout` owns the screen-space relationship between HUD gutters and collision bounds.', 'Rune names, Vortex/Split path identities, evolution thresholds, node descriptions, runtime stage names, and build summaries share `RuneEvolutionCatalog`. Vortex field tuning is isolated in `VortexEvolutionTuning`; Split attack geometry is isolated in `SplitEvolutionTuning`; `ArenaLayout` owns the screen-space relationship between HUD gutters and collision bounds.', 'README architecture text')
          text = replace_once(text, '  Catalog --> Evolution[VortexEvolutionSystem]\n', '  Catalog --> Evolution[VortexEvolutionSystem]\n  Catalog --> SplitEvolution[SplitEvolutionSystem]\n', 'README Mermaid Split evolution')
          text = replace_once(text, '  Domain --> Evolution\n  Evolution --> Tuning[VortexEvolutionTuning]\n', '  Domain --> Evolution\n  Domain --> SplitEvolution\n  Evolution --> Tuning[VortexEvolutionTuning]\n  SplitEvolution --> SplitTuning[SplitEvolutionTuning]\n', 'README Mermaid Split domain')
          text = replace_once(text, '  Events --> Status[Vortex Evolution Status]\n', '  Events --> Status[Rune Evolution Status]\n', 'README status name')
          text = replace_once(text, '`SessionDirector`, `VortexEvolutionSystem`, collision, Rune, Flow, Overdrive, target, and scoring logic remain renderer-independent.', '`SessionDirector`, `VortexEvolutionSystem`, `SplitEvolutionSystem`, collision, Rune, Flow, Overdrive, target, and scoring logic remain renderer-independent.', 'README domain list')
          note = '''\nP8.3 authors the second complete Rune evolution tree:\n\n- **Prism** expands Split from two side echoes into 4/6-point attack fans for coverage.\n- **Lance** collapses echoes onto the forward travel axis for deliberate reach and precision pressure.\n- Split evolves only when an active echo actually hits a target; empty casts do not advance the tree.\n- One compact Rune Evolution Status follows the most recently progressed authored Rune, avoiding a second persistent HUD row.\n\n'''
          text = text.replace('\n### Product shell contract\n', note + '### Product shell contract\n', 1)
          path.write_text(text)

          Path('docs/plans/rune-ball/P8-3-SPLIT-EVOLUTION.md').write_text('''# Rune Ball — P8.3 Split Evolution Gate\n\n## Risk question\n\n**Can Split support two evolution paths that produce meaningfully different attack geometry, proving the Rune Evolution architecture works beyond Vortex?**\n\n## Build paths\n\n### Prism — Coverage / Spread\n\n`Split → Refraction → Aurora Prism`\n\n- Base: two lateral echoes.\n- T1: four-point attack fan.\n- T2: six-point wide sweep.\n\n### Lance — Focus / Pierce\n\n`Split → Convergence → Void Lance`\n\n- Base: two lateral echoes.\n- T1: echoes collapse toward the forward travel axis.\n- T2: a longer three-point forward pressure column.\n\n## Evolution trigger\n\nA Split cast earns at most one qualified use, and only after a Split echo actually hits a target. Drawing `V` into empty space or activating Split without an echo contact does not progress evolution. Thresholds remain 3 → T1 and 6 → T2.\n\n## UX contract\n\n- Split is now an authored Rune card in Rune Tree.\n- Tree remains glyph-first; names and mechanics stay in the detail surface.\n- Tapping any Prism/Lance node switches that path directly and persists it in PlayerProfile.\n- Gameplay keeps one compact evolution status; it switches context to the authored Rune that most recently progressed.\n- Auto-evolution is primarily communicated by world feedback, not a modal or extra gameplay button.\n\n## Scope guard\n\nNo Chain evolution, new stages, run economy, Overdrive Archetypes, progression currency, backend/account work, or Production Pages Smoke.\n\n## Phone gate\n\n1. Prism clearly feels like wider attack coverage rather than just more particles.\n2. Lance rewards intentional travel direction and feels focused rather than weaker.\n3. Empty Split casts do not appear to advance evolution.\n4. T1/T2 auto-evolution is noticeable without interrupting play.\n5. Rune Tree path switching remains immediate and the two Split branches are visually distinguishable.\n6. Adding Split progression does not make the lower HUD feel crowded.\n''')
          PY

      - name: Install dependencies
        working-directory: rune-ball
        run: npm ci

      - name: Run tests
        working-directory: rune-ball
        run: npm test

      - name: Build
        working-directory: rune-ball
        run: npm run build

      - name: Commit product changes and remove patch workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-rune-ball-p8-3-patch.yml
          git add \
            rune-ball/src/progression/RuneEvolutionCatalog.ts \
            rune-ball/src/progression/SplitEvolutionSystem.ts \
            rune-ball/src/progression/SplitEvolutionTuning.ts \
            rune-ball/src/profile/PlayerProfile.ts \
            rune-ball/src/rune/RuneSystem.ts \
            rune-ball/src/game/DestructionSession.ts \
            rune-ball/src/presentation/DestructionScene.ts \
            rune-ball/src/presentation/RuneCausalityOverlay.ts \
            rune-ball/src/presentation/GameShell.ts \
            rune-ball/src/presentation/RuneTreePanel.ts \
