name: Inner Rail lockfile bootstrap

on:
  push:
    branches:
      - feat/inner-rail-p0-1-tilt-harness
    paths:
      - "inner-rail/package.json"
      - ".github/workflows/inner-rail-lockfile-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/inner-rail-p0-1-tilt-harness
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate lockfile
        working-directory: inner-rail
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inner-rail/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(inner-rail): generate package lock"
            git push origin HEAD:feat/inner-rail-p0-1-tilt-harness
          fi
