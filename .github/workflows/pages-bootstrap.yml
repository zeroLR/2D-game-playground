name: Bootstrap full GitHub Pages site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build games
        run: |
          set -euo pipefail
          build_game() { game="$1"; install="$2"; test_cmd="$3"; (cd "$game" && eval "$install" && if [ -n "$test_cmd" ]; then eval "$test_cmd"; fi && npm run build); }
          build_game simple-roguelike "npm ci" "npm test"
          build_game axiom "npm ci" "npm test"
          build_game vertex-parkour "npm install --no-audit --no-fund" "npm test"
          build_game neon-siege "npm install --no-audit --no-fund" ""
          build_game gomoku-rpg "npm install --no-audit --no-fund" "npm test"
          build_game stack-shift "npm install --no-audit --no-fund" "npm test"
          build_game domino-mischief "npm install --no-audit --no-fund" "npm test"
      - name: Assemble complete site
        run: |
          set -euo pipefail
          games="simple-roguelike axiom vertex-parkour neon-siege gomoku-rpg stack-shift domino-mischief"
          mkdir -p _site
          for game in $games; do mkdir -p "_site/$game"; cp -a "$game/dist/." "_site/$game/"; done
          cat > _site/index.html <<'HTML'
          <!doctype html><html lang="en"><meta charset="utf-8"><title>2D game playground</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:ui-monospace,monospace;background:#0d0d14;color:#d6d6e0;padding:24px;max-width:560px;margin:auto}h1,a{color:#f0b850}li{margin:14px 0}.desc{color:#8a8aa0;font-size:14px}</style><h1>2D game playground</h1><ul><li><a href="./simple-roguelike/">simple-roguelike</a></li><li><a href="./axiom/">axiom</a></li><li><a href="./vertex-parkour/">vertex-parkour</a></li><li><a href="./neon-siege/">neon-siege</a></li><li><a href="./gomoku-rpg/">gomoku-rpg</a></li><li><a href="./stack-shift/">stack-shift</a><div class="desc">Portrait 3D gravity-shifting puzzle prototype.</div></li><li><a href="./domino-mischief/">domino-mischief</a><div class="desc">Cozy portrait 3D domino chain-reaction puzzle prototype.</div></li></ul>
          HTML
      - name: Replace pages-state with complete site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf _pages_state
          git clone --depth 1 --branch pages-state "$remote" _pages_state || { mkdir _pages_state; git -C _pages_state init; git -C _pages_state checkout --orphan pages-state; git -C _pages_state remote add origin "$remote"; }
          rm -rf _pages_state/site; mkdir -p _pages_state/site; cp -a _site/. _pages_state/site/
          git -C _pages_state config user.name "github-actions[bot]"; git -C _pages_state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C _pages_state add -A
          if ! git -C _pages_state diff --cached --quiet; then git -C _pages_state commit -m "bootstrap complete Pages site"; git -C _pages_state push origin pages-state; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
