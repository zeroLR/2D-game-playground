name: Bootstrap full GitHub Pages site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build simple-roguelike
        working-directory: simple-roguelike
        run: |
          npm ci
          npm test
          npm run build

      - name: Build axiom
        working-directory: axiom
        run: |
          npm ci
          npm test
          npm run build

      - name: Build vertex-parkour
        working-directory: vertex-parkour
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build

      - name: Build neon-siege
        working-directory: neon-siege
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Assemble complete site
        run: |
          set -euo pipefail
          mkdir -p _site/simple-roguelike _site/axiom _site/vertex-parkour _site/neon-siege
          cp -a simple-roguelike/dist/. _site/simple-roguelike/
          cp -a axiom/dist/. _site/axiom/
          cp -a vertex-parkour/dist/. _site/vertex-parkour/
          cp -a neon-siege/dist/. _site/neon-siege/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <title>2D game playground</title>
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <style>
            body { font-family: ui-monospace, monospace; background: #0d0d14; color: #d6d6e0; padding: 24px; max-width: 560px; margin: 0 auto; }
            h1 { color: #f0b850; }
            ul { list-style: none; padding: 0; }
            li { margin: 12px 0; }
            a { color: #f0b850; text-decoration: none; }
            a:hover { text-decoration: underline; }
            .desc { color: #8a8aa0; font-size: 14px; }
          </style>
          <h1>2D game playground</h1>
          <ul>
            <li><a href="./simple-roguelike/">simple-roguelike</a><div class="desc">Turn-based roguelike with FOV, combat, and mobile D-pad.</div></li>
            <li><a href="./axiom/">axiom</a><div class="desc">Mobile-portrait reverse bullet-hell deckbuilder (WIP).</div></li>
            <li><a href="./vertex-parkour/">vertex-parkour</a><div class="desc">Mobile-portrait parkour roguelite vertical slice.</div></li>
            <li><a href="./neon-siege/">neon-siege</a><div class="desc">Cyberpunk horizontal action tower-defense MVP.</div></li>
          </ul>
          HTML

      - name: Replace pages-state with complete site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf _pages_state
          git clone --depth 1 --branch pages-state "$remote" _pages_state || {
            mkdir _pages_state
            git -C _pages_state init
            git -C _pages_state checkout --orphan pages-state
            git -C _pages_state remote add origin "$remote"
          }
          rm -rf _pages_state/site
          mkdir -p _pages_state/site
          cp -a _site/. _pages_state/site/
          git -C _pages_state config user.name "github-actions[bot]"
          git -C _pages_state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C _pages_state add -A
          if ! git -C _pages_state diff --cached --quiet; then
            git -C _pages_state commit -m "bootstrap complete Pages site"
            git -C _pages_state push origin pages-state
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
