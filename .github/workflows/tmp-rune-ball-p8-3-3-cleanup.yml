name: Rune Ball P8.3.3 cleanup

on:
  push:
    branches:
      - feat/rune-ball-p8-3-3-runtime-svg-alignment

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rune-ball-p8-3-3-runtime-svg-alignment
      - name: Remove generated artifacts
        run: |
          rm -rf rune-ball/node_modules rune-ball/dist
          rm .github/workflows/tmp-rune-ball-p8-3-3-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore(rune-ball): remove generated runtime artifacts"
          git push origin HEAD:feat/rune-ball-p8-3-3-runtime-svg-alignment
