name: Rune Ball P5.3 scene injection patch

on:
  push:
    branches:
      - fix/rune-ball-p5-3-preload-audio

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[scene-injected]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rune-ball-p5-3-preload-audio
          fetch-depth: 0

      - name: Inject preloaded AudioDirector into scene
        shell: python
        run: |
          from pathlib import Path

          path = Path('rune-ball/src/presentation/DestructionScene.ts')
          text = path.read_text()
          text = text.replace(
              '  private readonly audio = new AudioDirector();',
              '  private readonly audio: AudioDirector;',
          )
          text = text.replace(
              '  constructor(width: number, height: number) {\n    super();',
              '  constructor(width: number, height: number, audio: AudioDirector) {\n    super();\n    this.audio = audio;',
          )
          path.write_text(text)

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/rune-ball-p5-3-scene-injection.yml
          git add rune-ball/src/presentation/DestructionScene.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(rune-ball): inject preloaded audio into scene [scene-injected]"
          git push origin HEAD:fix/rune-ball-p5-3-preload-audio
