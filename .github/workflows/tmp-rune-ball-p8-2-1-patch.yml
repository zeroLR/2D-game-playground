name: Rune Ball P8.2.1 patch

on:
  push:
    branches:
      - feat/rune-ball-p8-2-1-rune-tree-arena-clarity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rune-ball-p8-2-1-rune-tree-arena-clarity
          fetch-depth: 0

      - name: Apply source patch
        run: python rune-ball/scripts/p8-2-1-patch.py

      - name: Commit product changes and remove patch scaffolding
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-rune-ball-p8-2-1-patch.yml
          git rm rune-ball/scripts/p8-2-1-patch.py
          git add rune-ball/src/presentation/GameShell.ts
          git add rune-ball/src/presentation/RuneTreePanel.ts
          git add rune-ball/src/presentation/DestructionScene.ts
          git add rune-ball/src/game/DestructionSession.ts
          git commit -m "feat(rune-ball): refine Rune Tree and arena HUD hierarchy"
          git push origin HEAD:feat/rune-ball-p8-2-1-rune-tree-arena-clarity
