name: Rune Ball P8.2.1 patch

on:
  push:
    branches:
      - feat/rune-ball-p8-2-1-rune-tree-arena-clarity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rune-ball-p8-2-1-rune-tree-arena-clarity
          fetch-depth: 0

      - name: Apply P8.2.1 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'missing replacement target: {label}')
              return text.replace(old, new, 1)

          def sub_once(text: str, pattern: str, repl: str, label: str) -> str:
              updated, count = re.subn(pattern, repl, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'expected one regex replacement for {label}, got {count}')
              return updated

          # GameShell: direct path selection language and callback semantics.
          path = Path('rune-ball/src/presentation/GameShell.ts')
          text = path.read_text()
          text = replace_once(
              text,
              "    intro.textContent = 'Inspect evolution nodes, then equip one path. During a run, qualified Rune uses advance that path automatically.';",
              "    intro.textContent = 'Choose a Rune, then tap an evolution symbol to make that path active. Qualified uses evolve it automatically during a run.';",
              'Rune screen intro',
          )
          text = replace_once(text, '      onEquipVortexPath: (path) => {', '      onVortexPathChange: (path) => {', 'RuneTree callback')
          path.write_text(text)

          # RuneTreePanel: glyph-first tree, node tap immediately selects path, detail becomes descriptive only.
          path = Path('rune-ball/src/presentation/RuneTreePanel.ts')
          text = path.read_text()
          text = text.replace('onEquipVortexPath', 'onVortexPathChange')
          text = replace_once(text, "    const activePath = getVortexPathDefinition(this.selectedPath);\n\n", '', 'active path local')
          text = sub_once(
              text,
              r"    const summary = document\.createElement\('div'\);\n    summary\.className = 'rune-tree-active-build';.*?    summary\.append\(summaryLabel, summaryValue, summaryIdentity\);\n\n",
              '',
              'Vortex active summary',
          )
          text = sub_once(
              text,
              r"    const identity = document\.createElement\('header'\);\n    identity\.className = 'rune-tree-identity';.*?    identity\.append\(glyph, identityCopy\);\n\n",
              '',
              'Vortex identity copy',
          )
          text = replace_once(
              text,
              "    baseNode.innerHTML = '<span>BASE</span><strong>VORTEX</strong><small>START OF RUN</small>';",
              "    baseNode.setAttribute('aria-label', 'Base Vortex');\n    const baseGlyph = document.createElement('span');\n    baseGlyph.className = 'rune-tree-node-base-glyph';\n    baseGlyph.textContent = base.glyph;\n    baseGlyph.setAttribute('aria-hidden', 'true');\n    baseNode.append(baseGlyph);",
              'Vortex base node',
          )
          text = sub_once(
              text,
              r"      const branchHeader = document\.createElement\('div'\);\n      branchHeader\.className = 'rune-tree-branch-header';.*?      branchHeader\.append\(pathTitle, pathIdentity\);\n",
              "      const pathMark = document.createElement('span');\n      pathMark.className = `rune-tree-path-mark rune-tree-path-mark--${path}`;\n      pathMark.setAttribute('aria-hidden', 'true');\n",
              'Vortex branch headers',
          )
          text = replace_once(
              text,
              '      branch.append(branchHeader, tierOne, rail, tierTwo);',
              '      branch.append(pathMark, tierOne, rail, tierTwo);',
              'Vortex branch composition',
          )
          text = replace_once(
              text,
              '    graph.append(identity, baseNode, branches);\n    this.treeMount.append(summary, graph);',
              '    graph.append(baseNode, branches);\n    this.treeMount.append(graph);',
              'Vortex graph composition',
          )
          text = sub_once(
              text,
              r"    const tierLabel = document\.createElement\('span'\);.*?    button\.append\(tierLabel, name, trigger\);",
              "    const sigil = document.createElement('span');\n    sigil.className = `rune-tree-node-sigil rune-tree-node-sigil--${path} rune-tree-node-sigil--tier-${tier}`;\n    sigil.setAttribute('aria-hidden', 'true');\n    const core = document.createElement('span');\n    core.className = 'rune-tree-node-sigil-core';\n    sigil.append(core);\n    button.append(sigil);",
              'evolution node copy',
          )
          text = replace_once(
              text,
              "    button.addEventListener('click', () => {\n      this.selectedNode = { kind: 'evolution', path, tier };\n      this.syncNodeSelection();\n      this.renderDetail();\n    });",
              "    button.addEventListener('click', () => {\n      if (path !== this.selectedPath) {\n        this.selectedPath = path;\n        this.callbacks.onVortexPathChange(path);\n      }\n      this.selectedNode = { kind: 'evolution', path, tier };\n      this.syncVortexState();\n      this.renderDetail();\n    });",
              'direct path selection',
          )
          text = sub_once(
              text,
              r"    const summary = document\.createElement\('div'\);\n    summary\.className = 'rune-tree-active-build rune-tree-active-build-future';.*?    summary\.innerHTML = .*?;\n\n",
              '',
              'future summary',
          )
          text = sub_once(
              text,
              r"    const identity = document\.createElement\('header'\);\n    identity\.className = 'rune-tree-identity';\n    identity\.innerHTML = \[.*?    \]\.join\(''\);\n\n",
              '',
              'future identity',
          )
          text = replace_once(
              text,
              "    baseNode.innerHTML = `<span>BASE</span><strong>${definition.name}</strong><small>AVAILABLE</small>`;",
              "    const baseGlyph = document.createElement('span');\n    baseGlyph.className = 'rune-tree-node-base-glyph';\n    baseGlyph.textContent = definition.glyph;\n    baseGlyph.setAttribute('aria-hidden', 'true');\n    baseNode.append(baseGlyph);",
              'future base glyph',
          )
          text = sub_once(
              text,
              r"      branch\.className = 'rune-tree-branch rune-tree-future-branch';\n      branch\.innerHTML = \[.*?      \]\.join\(''\);",
              "      branch.className = 'rune-tree-branch rune-tree-future-branch';\n      branch.innerHTML = [\n        '<span class=\"rune-tree-future-path-mark\" aria-hidden=\"true\"></span>',\n        '<div class=\"rune-tree-node rune-tree-future-node\"><span class=\"rune-tree-future-node-mark\" aria-hidden=\"true\"></span></div>',\n        '<span class=\"rune-tree-rail\" aria-hidden=\"true\"></span>',\n        '<div class=\"rune-tree-node rune-tree-future-node\"><span class=\"rune-tree-future-node-mark rune-tree-future-node-mark--final\" aria-hidden=\"true\"></span></div>',\n      ].join('');",
              'future branch glyphs',
          )
          text = replace_once(
              text,
              '    graph.append(identity, baseNode, branches);\n    this.treeMount.append(summary, graph);',
              '    graph.append(baseNode, branches);\n    this.treeMount.append(graph);',
              'future graph composition',
          )
          text = sub_once(
              text,
              r"    const action = document\.createElement\('button'\);.*?    card\.append\(action\);",
              "    const active = document.createElement('span');\n    active.className = 'rune-tree-detail-active';\n    active.textContent = `${path.title} PATH ACTIVE`;\n    card.append(active);",
              'detail Equip CTA',
          )
          text = sub_once(
              text,
              r"\n  private equipPath\(path: VortexEvolutionPath\): void \{.*?\n  \}\n\n  private syncVortexState",
              '\n  private syncVortexState',
              'equipPath method',
          )
          text = sub_once(
              text,
              r"\n    const active = this\.treeMount\.querySelector<HTMLElement>\('\.rune-tree-active-build'\);.*?\n    \}",
              '',
              'active summary synchronization',
          )
          path.write_text(text)

          # DestructionSession: use centralized tuning; Orbit duration is deliberately sustained.
          path = Path('rune-ball/src/game/DestructionSession.ts')
          text = path.read_text()
          text = replace_once(
              text,
              "import { RuneSystem, type RuneSnapshot } from '../rune/RuneSystem';",
              "import { RuneSystem, type RuneSnapshot } from '../rune/RuneSystem';\nimport {\n  BASE_VORTEX_PROFILE,\n  getVortexCastProfile,\n  type VortexCastProfile,\n} from '../progression/VortexEvolutionTuning';",
              'Vortex tuning import',
          )
          text = sub_once(
              text,
              r"\ninterface VortexCastProfile \{.*?\n\}\n\nconst BASE_TARGET_COUNT = 8;\nconst OVERDRIVE_TARGET_COUNT = 11;\nconst BASE_VORTEX_PROFILE: VortexCastProfile = \{.*?\n\};",
              "\nconst BASE_TARGET_COUNT = 8;\nconst OVERDRIVE_TARGET_COUNT = 11;",
              'inline Vortex tuning',
          )
          text = sub_once(
              text,
              r"  private vortexProfileForCurrentStage\(\): VortexCastProfile \{.*?\n  \}\n\n  private enterOverdrive",
              "  private vortexProfileForCurrentStage(): VortexCastProfile {\n    const evolution = this.vortexEvolution.snapshot;\n    return getVortexCastProfile(evolution.path, evolution.stage);\n  }\n\n  private enterOverdrive",
              'Vortex profile method',
          )
          path.write_text(text)

          # DestructionScene: actual collision bounds and HUD gutters share one layout source.
          path = Path('rune-ball/src/presentation/DestructionScene.ts')
          text = path.read_text()
          text = replace_once(
              text,
              "import { ImpactPool } from './ImpactPool';",
              "import { ImpactPool } from './ImpactPool';\nimport { calculateArenaLayout, type ArenaLayout } from './ArenaLayout';",
              'ArenaLayout import',
          )
          text = replace_once(
              text,
              '  private arenaBounds: ArenaBounds;\n  private viewportWidth = 1;',
              '  private arenaBounds: ArenaBounds;\n  private arenaLayout: ArenaLayout;\n  private viewportWidth = 1;',
              'arenaLayout field',
          )
          text = replace_once(
              text,
              '    this.arenaBounds = this.calculateArenaBounds(width, height);',
              '    this.arenaLayout = calculateArenaLayout(width, height);\n    this.arenaBounds = this.arenaLayout.bounds;',
              'constructor arena layout',
          )
          text = replace_once(
              text,
              '    this.arenaBounds = this.calculateArenaBounds(safeWidth, safeHeight);',
              '    this.arenaLayout = calculateArenaLayout(safeWidth, safeHeight);\n    this.arenaBounds = this.arenaLayout.bounds;',
              'viewport arena layout',
          )
          text = replace_once(
              text,
              '    this.scoreText.position.set(left + 14, top + 16);\n    this.comboText.position.set(right - 14, top + 16);\n    this.runeGuide.position.set(safeWidth / 2, bottom - 20);',
              '    this.scoreText.position.set(left + 14, this.arenaLayout.scoreY);\n    this.comboText.position.set(right - 14, this.arenaLayout.scoreY);\n    this.runeGuide.position.set(safeWidth / 2, this.arenaLayout.runeGuideY);',
              'HUD anchor positions',
          )
          text = replace_once(
              text,
              "    const { left, right, bottom } = this.arenaBounds;\n    const width = Math.min(150, (right - left) * 0.42);\n    const x = (left + right) / 2 - width / 2;\n    const y = bottom - 14;",
              "    const { left, right } = this.arenaBounds;\n    const width = Math.min(150, (right - left) * 0.42);\n    const x = (left + right) / 2 - width / 2;\n    const y = this.arenaLayout.runeBarY;",
              'Rune bar gutter',
          )
          text = replace_once(
              text,
              "    const { left, right, top } = this.arenaBounds;\n    const width = Math.min(170, (right - left) * 0.46);\n    const x = (left + right) / 2 - width / 2;\n    const y = top + 17;",
              "    const { left, right } = this.arenaBounds;\n    const width = Math.min(170, (right - left) * 0.46);\n    const x = (left + right) / 2 - width / 2;\n    const y = this.arenaLayout.flowBarY;",
              'Flow bar gutter',
          )
          text = sub_once(
              text,
              r"\n  private calculateArenaBounds\(width: number, height: number\): ArenaBounds \{.*?\n  \}\n\}",
              '\n}',
              'old arena bounds calculator',
          )
          path.write_text(text)

          # Rune tree visual override: graphical nodes carry the tree; names/descriptions live in detail.
          path = Path('rune-ball/src/rune-tree.css')
          text = path.read_text()
          marker = '/* P8.2.1 glyph-first tree refinement */'
          if marker in text:
              raise SystemExit('P8.2.1 rune tree CSS already applied')
          text += r'''

/* P8.2.1 glyph-first tree refinement */
.rune-tree-canvas {
  gap: 8px;
}

.rune-tree-graph {
  gap: 10px;
  padding-top: 18px;
}

.rune-tree-base-node {
  width: 78px;
  min-height: 78px;
  padding: 0;
  border-radius: 50%;
}

.rune-tree-node-base-glyph {
  display: grid;
  place-items: center;
  width: 54px;
  height: 54px;
  color: var(--rb-cyan) !important;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace !important;
  font-size: 38px !important;
  font-weight: 400 !important;
  letter-spacing: 0 !important;
  line-height: 1 !important;
}

.rune-tree-branch-grid {
  gap: 18px;
  padding-top: 20px;
}

.rune-tree-branch {
  grid-template-rows: 16px 88px 24px 88px;
  justify-items: center;
  gap: 8px;
}

.rune-tree-path-mark,
.rune-tree-future-path-mark {
  position: relative;
  display: block;
  width: 14px;
  height: 14px;
  border: 1px solid rgb(143 77 255 / 44%);
  border-radius: 50%;
}

.rune-tree-path-mark::after {
  position: absolute;
  content: '';
}

.rune-tree-path-mark--gravity-well::after {
  inset: 4px;
  border-radius: 50%;
  background: var(--rb-violet);
  box-shadow: 0 0 8px rgb(143 77 255 / 38%);
}

.rune-tree-path-mark--orbit::after {
  top: -3px;
  left: 50%;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--rb-cyan);
  box-shadow: 0 0 7px rgb(111 233 255 / 52%);
  transform: translateX(-50%);
}

.rune-tree-branch[data-equipped="true"] .rune-tree-path-mark {
  border-color: rgb(111 233 255 / 76%);
  box-shadow: 0 0 12px rgb(111 233 255 / 15%);
}

.rune-tree-evolution-node {
  width: 88px;
  min-height: 88px;
  padding: 0;
  place-items: center;
  border-radius: 50%;
}

.rune-tree-node-sigil {
  position: relative;
  display: block !important;
  width: 54px;
  height: 54px;
  border: 1.5px solid rgb(143 77 255 / 66%);
  border-radius: 50%;
  color: inherit !important;
  font-size: 0 !important;
  letter-spacing: 0 !important;
}

.rune-tree-node-sigil::before,
.rune-tree-node-sigil::after,
.rune-tree-node-sigil-core {
  position: absolute;
  content: '';
}

.rune-tree-node-sigil-core {
  display: block !important;
  padding: 0 !important;
  font-size: 0 !important;
  letter-spacing: 0 !important;
}

.rune-tree-node-sigil--gravity-well::before {
  inset: 9px;
  border: 1px solid rgb(111 233 255 / 58%);
  border-radius: 50%;
}

.rune-tree-node-sigil--gravity-well::after {
  inset: 18px;
  border: 1px solid rgb(215 86 255 / 72%);
  border-radius: 50%;
}

.rune-tree-node-sigil--gravity-well .rune-tree-node-sigil-core {
  top: 50%;
  left: 50%;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--rb-cyan);
  box-shadow: 0 0 11px rgb(111 233 255 / 54%);
  transform: translate(-50%, -50%);
}

.rune-tree-node-sigil--gravity-well.rune-tree-node-sigil--tier-2 {
  border-color: rgb(111 233 255 / 72%);
  box-shadow: inset 0 0 14px rgb(215 86 255 / 10%);
}

.rune-tree-node-sigil--gravity-well.rune-tree-node-sigil--tier-2::before {
  inset: 6px;
  border-width: 2px;
}

.rune-tree-node-sigil--gravity-well.rune-tree-node-sigil--tier-2::after {
  inset: 15px;
  border-width: 2px;
}

.rune-tree-node-sigil--gravity-well.rune-tree-node-sigil--tier-2 .rune-tree-node-sigil-core {
  width: 10px;
  height: 10px;
  background: var(--rb-text);
  box-shadow: 0 0 14px rgb(111 233 255 / 72%), 0 0 24px rgb(215 86 255 / 32%);
}

.rune-tree-node-sigil--orbit {
  border-color: rgb(143 77 255 / 72%);
}

.rune-tree-node-sigil--orbit::before {
  inset: 9px;
  border: 1px solid rgb(111 233 255 / 60%);
  border-top-color: transparent;
  border-radius: 50%;
  transform: rotate(-24deg);
}

.rune-tree-node-sigil--orbit::after {
  top: 4px;
  left: 50%;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--rb-cyan);
  box-shadow: 0 0 10px rgb(111 233 255 / 48%);
  transform: translateX(-50%);
}

.rune-tree-node-sigil--orbit .rune-tree-node-sigil-core {
  right: 5px;
  bottom: 11px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--rb-magenta);
  box-shadow: 0 0 8px rgb(215 86 255 / 44%);
}

.rune-tree-node-sigil--orbit.rune-tree-node-sigil--tier-2 {
  border-width: 2px;
  box-shadow: 0 0 0 5px rgb(111 233 255 / 8%);
}

.rune-tree-node-sigil--orbit.rune-tree-node-sigil--tier-2::before {
  inset: 6px;
  border-width: 2px;
  border-right-color: transparent;
  transform: rotate(38deg);
}

.rune-tree-node-sigil--orbit.rune-tree-node-sigil--tier-2::after {
  width: 7px;
  height: 7px;
  box-shadow: 0 0 12px rgb(111 233 255 / 62%), -26px 25px 0 -1px var(--rb-magenta);
}

.rune-tree-branch[data-equipped="true"] .rune-tree-node-sigil {
  border-color: rgb(111 233 255 / 82%);
}

.rune-tree-evolution-node[aria-pressed="true"] {
  border-color: rgb(234 246 255 / 82%);
  background: rgb(17 28 45 / 94%);
  box-shadow: 0 0 0 2px rgb(111 233 255 / 12%), 0 0 26px rgb(111 233 255 / 11%);
}

.rune-tree-evolution-node[aria-pressed="true"] .rune-tree-node-sigil {
  filter: drop-shadow(0 0 8px rgb(111 233 255 / 24%));
}

.rune-tree-detail-mount {
  min-height: 184px;
}

.rune-tree-detail-active {
  justify-self: start;
  padding: 5px 8px;
  border: 1px solid rgb(111 233 255 / 24%);
  border-radius: 999px;
  background: rgb(111 233 255 / 6%);
  color: var(--rb-cyan);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 8px;
  font-weight: 760;
  letter-spacing: 0.08em;
}

.rune-tree-future-path-mark {
  border-style: dashed;
  border-color: rgb(113 130 155 / 26%);
}

.rune-tree-future-node {
  width: 88px;
  min-height: 88px;
  padding: 0;
  place-items: center;
  border-radius: 50%;
}

.rune-tree-future-node-mark {
  position: relative;
  display: block !important;
  width: 42px;
  height: 42px;
  border: 1px dashed rgb(113 130 155 / 34%);
  border-radius: 50%;
  font-size: 0 !important;
}

.rune-tree-future-node-mark::before,
.rune-tree-future-node-mark::after {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 13px;
  height: 1px;
  background: rgb(113 130 155 / 34%);
  content: '';
  transform: translate(-50%, -50%) rotate(45deg);
}

.rune-tree-future-node-mark::after {
  transform: translate(-50%, -50%) rotate(-45deg);
}

.rune-tree-future-node-mark--final {
  width: 50px;
  height: 50px;
}

@media (max-width: 350px) {
  .rune-tree-branch-grid {
    gap: 10px;
  }

  .rune-tree-evolution-node,
  .rune-tree-future-node {
    width: 80px;
    min-height: 80px;
  }

  .rune-tree-node-sigil {
    width: 48px;
    height: 48px;
  }
}
'''
          path.write_text(text)

          # P8.2 is historical; note the interaction refinement that supersedes its explicit Equip gate.
          path = Path('docs/plans/rune-ball/P8-2-RUNE-TREE-UX.md')
          text = path.read_text()
          note = "> **P8.2.1 refinement:** phone feedback simplified this interaction after the gate. Evolution nodes become glyph-first and tapping a Vortex branch node now selects that path immediately; the explicit `EQUIP PATH` confirmation described below is superseded by `P8-2-1-RUNE-TREE-ARENA-CLARITY.md`.\n\n"
          anchor = 'P8.2 deepens the product-level configuration surface established by P8.1. It does not add new Rune mechanics.\n\n'
          text = replace_once(text, anchor, anchor + note, 'P8.2 refinement note')
          path.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-rune-ball-p8-2-1-patch.yml
          git add \
            rune-ball/src/presentation/GameShell.ts \
            rune-ball/src/presentation/RuneTreePanel.ts \
            rune-ball/src/presentation/DestructionScene.ts \
            rune-ball/src/game/DestructionSession.ts \
            rune-ball/src/rune-tree.css \
            docs/plans/rune-ball/P8-2-RUNE-TREE-UX.md
          git commit -m "feat(rune-ball): refine Rune Tree and arena HUD hierarchy"
          git push origin HEAD:feat/rune-ball-p8-2-1-rune-tree-arena-clarity
