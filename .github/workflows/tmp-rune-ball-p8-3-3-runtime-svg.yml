name: Rune Ball P8.3.3 runtime SVG integration

on:
  push:
    branches:
      - feat/rune-ball-p8-3-3-runtime-svg-alignment

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rune-ball-p8-3-3-runtime-svg-alignment
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply runtime SVG integration
        run: node .github/patches/p8-3-3-runtime-svg.mjs
      - name: Install dependencies
        working-directory: rune-ball
        run: npm ci
      - name: Run tests
        working-directory: rune-ball
        run: npm test
      - name: Build
        working-directory: rune-ball
        run: npm run build
      - name: Commit clean product changes
        run: |
          rm .github/workflows/tmp-rune-ball-p8-3-3-runtime-svg.yml
          rm .github/patches/p8-3-3-runtime-svg.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(rune-ball): align Split runtime with shared SVG identity"
          git push origin HEAD:feat/rune-ball-p8-3-3-runtime-svg-alignment
