name: Rune Ball P8.2.2 patch

on:
  push:
    branches:
      - feat/rune-ball-p8-2-2-runtime-readability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rune-ball-p8-2-2-runtime-readability
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply source patch
        run: python .tmp/p8_2_2_patch.py

      - name: Install dependencies
        working-directory: rune-ball
        run: npm ci

      - name: Run tests
        working-directory: rune-ball
        run: npm test

      - name: Build
        working-directory: rune-ball
        run: npm run build

      - name: Commit product changes and remove patch scaffolding
        run: |
          rm .github/workflows/tmp-rune-ball-p8-2-2-patch.yml
          rm .tmp/p8_2_2_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rune-ball docs/plans/rune-ball/P8-2-2-RUNTIME-READABILITY.md .github/workflows/tmp-rune-ball-p8-2-2-patch.yml .tmp/p8_2_2_patch.py
          git commit -m 'feat(rune-ball): refine base Rune semantics and telemetry layout'
          git push origin HEAD:feat/rune-ball-p8-2-2-runtime-readability
