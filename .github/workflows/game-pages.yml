name: Reusable game CI and Pages deploy

on:
  workflow_call:
    inputs:
      game:
        required: true
        type: string
      install-command:
        required: true
        type: string
      run-tests:
        required: true
        type: boolean
      deploy:
        required: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ${{ inputs.game }}
        run: ${{ inputs.install-command }}

      - name: Run tests
        if: inputs.run-tests
        working-directory: ${{ inputs.game }}
        run: npm test

      - name: Build
        working-directory: ${{ inputs.game }}
        run: npm run build

      - name: Upload game dist
        if: inputs.deploy
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.game }}-dist
          path: ${{ inputs.game }}/dist
          if-no-files-found: error

  publish:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download game dist
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.game }}-dist
          path: _game_dist

      - name: Restore published site state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code "$remote" refs/heads/pages-state >/dev/null 2>&1; then
            git clone --depth 1 --branch pages-state "$remote" _pages_state
          else
            mkdir -p _pages_state/site
            git -C _pages_state init
            git -C _pages_state checkout --orphan pages-state
            git -C _pages_state remote add origin "$remote"

            # One-time bootstrap: preserve the currently published games before
            # the incremental pages-state branch exists.
            repo_name="${GITHUB_REPOSITORY#*/}"
            site_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo_name}/"
            mkdir -p _bootstrap
            wget --quiet --recursive --no-parent --no-host-directories \
              --cut-dirs=1 --page-requisites "$site_url" \
              --directory-prefix _bootstrap || true
            if [ -n "$(find _bootstrap -mindepth 1 -print -quit)" ]; then
              cp -a _bootstrap/. _pages_state/site/
            fi
          fi

      - name: Replace changed game in site state
        env:
          GAME: ${{ inputs.game }}
        run: |
          set -euo pipefail
          rm -rf "_pages_state/site/${GAME}"
          mkdir -p "_pages_state/site/${GAME}"
          cp -a _game_dist/. "_pages_state/site/${GAME}/"

          cat > _pages_state/site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <title>2D game playground</title>
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <style>
            body { font-family: ui-monospace, monospace; background: #0d0d14; color: #d6d6e0; padding: 24px; max-width: 560px; margin: 0 auto; }
            h1 { color: #f0b850; }
            ul { list-style: none; padding: 0; }
            li { margin: 12px 0; }
            a { color: #f0b850; text-decoration: none; }
            a:hover { text-decoration: underline; }
            .desc { color: #8a8aa0; font-size: 14px; }
          </style>
          <h1>2D game playground</h1>
          <ul>
            <li><a href="./simple-roguelike/">simple-roguelike</a><div class="desc">Turn-based roguelike with FOV, combat, and mobile D-pad.</div></li>
            <li><a href="./axiom/">axiom</a><div class="desc">Mobile-portrait reverse bullet-hell deckbuilder (WIP).</div></li>
            <li><a href="./vertex-parkour/">vertex-parkour</a><div class="desc">Mobile-portrait parkour roguelite vertical slice.</div></li>
            <li><a href="./neon-siege/">neon-siege</a><div class="desc">Cyberpunk horizontal action tower-defense MVP.</div></li>
          </ul>
          HTML

      - name: Persist site state
        env:
          GAME: ${{ inputs.game }}
        run: |
          set -euo pipefail
          git -C _pages_state config user.name "github-actions[bot]"
          git -C _pages_state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C _pages_state add site
          if ! git -C _pages_state diff --cached --quiet; then
            git -C _pages_state commit -m "deploy ${GAME}"
            git -C _pages_state push origin pages-state
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages_state/site

      - id: deployment
        uses: actions/deploy-pages@v4
