name: Reusable game CI and Pages deploy

on:
  workflow_call:
    inputs:
      game: { required: true, type: string }
      install-command: { required: true, type: string }
      run-tests: { required: true, type: boolean }
      deploy: { required: true, type: boolean }

permissions: { contents: write, pages: write, id-token: write }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install dependencies
        working-directory: ${{ inputs.game }}
        run: ${{ inputs.install-command }}
      - name: Run tests
        if: inputs.run-tests
        working-directory: ${{ inputs.game }}
        run: npm test
      - name: Build
        working-directory: ${{ inputs.game }}
        run: npm run build
      - name: Upload game dist
        if: inputs.deploy
        uses: actions/upload-artifact@v4
        with: { name: "${{ inputs.game }}-dist", path: "${{ inputs.game }}/dist", if-no-files-found: error }
  publish:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    concurrency: { group: pages-publish, cancel-in-progress: false }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: "${{ inputs.game }}-dist", path: _game_dist }
      - name: Restore complete site state
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --depth 1 --branch pages-state "$remote" _pages_state
      - name: Replace changed game in site state
        env: { GAME: "${{ inputs.game }}" }
        run: |
          rm -rf "_pages_state/site/${GAME}"; mkdir -p "_pages_state/site/${GAME}"; cp -a _game_dist/. "_pages_state/site/${GAME}/"
      - name: Validate complete site before publish
        run: |
          set -euo pipefail
          missing=0
          for game in simple-roguelike axiom vertex-parkour neon-siege gomoku-rpg stack-shift domino-mischief iron-tempest inkbound bitland; do
            if [ ! -f "_pages_state/site/${game}/index.html" ]; then echo "Missing published game: ${game}"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then echo "Refusing partial deployment. Run Bootstrap full GitHub Pages site workflow."; exit 1; fi
      - name: Refresh landing page
        run: |
          cat > _pages_state/site/index.html <<'HTML'
          <!doctype html><html lang="en"><meta charset="utf-8"><title>2D game playground</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:ui-monospace,monospace;background:#0d0d14;color:#d6d6e0;padding:24px;max-width:560px;margin:auto}h1,a{color:#f0b850}ul{list-style:none;padding:0}li{margin:12px 0}a{text-decoration:none}.desc{color:#8a8aa0;font-size:14px}</style><h1>2D game playground</h1><ul>
          <li><a href="./bitland/">bitland</a><div class="desc">Binary-world systemic sandbox RPG — deterministic discovery foundation.</div></li>
          <li><a href="./inkbound/">inkbound</a><div class="desc">Portrait ink-wash 2D adventure — P0.1 mobile shell.</div></li>
          <li><a href="./iron-tempest/">iron-tempest</a><div class="desc">16-bit vertical bullet-hell roguelite weapon-build prototype.</div></li>
          <li><a href="./simple-roguelike/">simple-roguelike</a><div class="desc">Turn-based roguelike with FOV, combat, and mobile D-pad.</div></li>
          <li><a href="./axiom/">axiom</a><div class="desc">Mobile-portrait reverse bullet-hell deckbuilder (WIP).</div></li>
          <li><a href="./vertex-parkour/">vertex-parkour</a><div class="desc">Mobile-portrait parkour roguelite vertical slice.</div></li>
          <li><a href="./neon-siege/">neon-siege</a><div class="desc">Cyberpunk horizontal action tower-defense MVP.</div></li>
          <li><a href="./gomoku-rpg/">gomoku-rpg</a><div class="desc">Portrait-first 9×9 Gomoku RPG.</div></li>
          <li><a href="./stack-shift/">stack-shift</a><div class="desc">Portrait 3D gravity-shifting puzzle prototype.</div></li>
          <li><a href="./domino-mischief/">domino-mischief</a><div class="desc">Cozy portrait 3D domino chain-reaction puzzle prototype.</div></li></ul></html>
          HTML
      - name: Persist site state
        env: { GAME: "${{ inputs.game }}" }
        run: |
          git -C _pages_state config user.name "github-actions[bot]"
          git -C _pages_state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C _pages_state add site
          if ! git -C _pages_state diff --cached --quiet; then git -C _pages_state commit -m "deploy ${GAME}"; git -C _pages_state push origin pages-state; fi
      - uses: actions/upload-pages-artifact@v3
        with: { path: _pages_state/site }
      - id: deployment
        uses: actions/deploy-pages@v4
