name: Rune Ball P8.3.2 visual system

on:
  push:
    branches:
      - feat/rune-ball-p8-3-2-rune-tree-visual-system

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rune-ball-p8-3-2-rune-tree-visual-system
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Rune Tree visual system
        shell: bash
        run: |
          cat > rune-ball/src/presentation/RuneTreeGlyphs.ts <<'EOF'
          import type { RuneTreeId } from '../progression/RuneEvolutionCatalog';

          export type RuneTreeGlyphId =
            | 'base-vortex'
            | 'base-split'
            | 'base-chain'
            | 'gravity-well-1'
            | 'gravity-well-2'
            | 'orbit-1'
            | 'orbit-2'
            | 'prism-1'
            | 'prism-2'
            | 'lance-1'
            | 'lance-2';

          const SVG_NS = 'http://www.w3.org/2000/svg';

          const GLYPHS: Record<RuneTreeGlyphId, string> = {
            'base-vortex': `
              <circle class="rtg-ghost" cx="32" cy="32" r="22" />
              <path class="rtg-primary" d="M13 31c2-11 11-19 22-19 8 0 15 4 19 10" />
              <path class="rtg-secondary" d="M51 34c-2 10-10 18-21 18-8 0-15-4-19-10" />
              <path class="rtg-primary rtg-thin" d="M19 22c5 3 9 4 15 2 5-2 9-1 13 2" />
              <circle class="rtg-core" cx="32" cy="32" r="4" />
            `,
            'base-split': `
              <circle class="rtg-core" cx="32" cy="32" r="4" />
              <path class="rtg-primary" d="M28 30 13 17 7 12l5 13 12 9" />
              <path class="rtg-secondary" d="m36 30 15-13 6-5-5 13-12 9" />
              <path class="rtg-primary rtg-thin" d="M25 35 13 48 8 53l5-14 10-7" />
              <path class="rtg-secondary rtg-thin" d="m39 35 12 13 5 5-5-14-10-7" />
            `,
            'base-chain': `
              <path class="rtg-secondary" d="M13 17 31 31 50 14" />
              <path class="rtg-primary" d="M31 31 48 49" />
              <circle class="rtg-node" cx="13" cy="17" r="5" />
              <circle class="rtg-core" cx="31" cy="31" r="5" />
              <circle class="rtg-node" cx="50" cy="14" r="5" />
              <circle class="rtg-node rtg-node-secondary" cx="48" cy="49" r="5" />
            `,
            'gravity-well-1': `
              <circle class="rtg-primary" cx="32" cy="32" r="21" />
              <circle class="rtg-secondary" cx="32" cy="32" r="13" />
              <circle class="rtg-core" cx="32" cy="32" r="5" />
              <path class="rtg-primary rtg-thin" d="m15 19 7 6M49 19l-7 6M15 45l7-6M49 45l-7-6" />
            `,
            'gravity-well-2': `
              <circle class="rtg-ghost" cx="32" cy="32" r="25" />
              <circle class="rtg-primary" cx="32" cy="32" r="20" />
              <circle class="rtg-secondary" cx="32" cy="32" r="12" />
              <path class="rtg-primary" d="M32 6v10M32 48v10M6 32h10M48 32h10" />
              <path class="rtg-secondary rtg-thin" d="m13 13 8 8m22 22 8 8m0-38-8 8M21 43l-8 8" />
              <circle class="rtg-core rtg-core-peak" cx="32" cy="32" r="6" />
            `,
            'orbit-1': `
              <circle class="rtg-core" cx="32" cy="32" r="5" />
              <ellipse class="rtg-primary" cx="32" cy="32" rx="23" ry="13" transform="rotate(-24 32 32)" />
              <circle class="rtg-node" cx="48" cy="17" r="4" />
              <path class="rtg-secondary rtg-thin" d="M18 46c9 6 21 5 29-2" />
            `,
            'orbit-2': `
              <circle class="rtg-core rtg-core-peak" cx="32" cy="32" r="6" />
              <ellipse class="rtg-primary" cx="32" cy="32" rx="25" ry="14" transform="rotate(-25 32 32)" />
              <ellipse class="rtg-secondary" cx="32" cy="32" rx="19" ry="27" transform="rotate(36 32 32)" />
              <circle class="rtg-node" cx="50" cy="15" r="4" />
              <circle class="rtg-node rtg-node-secondary" cx="14" cy="45" r="4" />
            `,
            'prism-1': `
              <circle class="rtg-core" cx="32" cy="32" r="4" />
              <polygon class="rtg-facet rtg-primary-fill" points="28,29 17,19 5,17 13,28 25,34" />
              <polygon class="rtg-facet rtg-primary-fill" points="36,29 47,19 59,17 51,28 39,34" />
              <path class="rtg-secondary rtg-thin" d="M25 34 13 42 7 47l15-3 8-8M39 34l12 8 6 5-15-3-8-8" />
            `,
            'prism-2': `
              <circle class="rtg-core rtg-core-peak" cx="32" cy="32" r="5" />
              <polygon class="rtg-facet rtg-primary-fill" points="28,29 17,18 2,13 10,28 24,35" />
              <polygon class="rtg-facet rtg-primary-fill" points="36,29 47,18 62,13 54,28 40,35" />
              <polygon class="rtg-facet rtg-secondary-fill" points="25,35 12,37 3,50 20,45 30,38" />
              <polygon class="rtg-facet rtg-secondary-fill" points="39,35 52,37 61,50 44,45 34,38" />
              <path class="rtg-primary rtg-thin" d="M10 28 3 31M54 28l7 3" />
            `,
            'lance-1': `
              <circle class="rtg-core" cx="32" cy="45" r="5" />
              <path class="rtg-secondary" d="M32 45V20" />
              <polygon class="rtg-spear rtg-primary-fill" points="32,5 25,23 32,19 39,23" />
              <path class="rtg-primary" d="M21 43h22M26 49l6 9 6-9" />
            `,
            'lance-2': `
              <circle class="rtg-core rtg-core-peak" cx="32" cy="46" r="5" />
              <path class="rtg-primary" d="M32 47V15" />
              <path class="rtg-secondary rtg-thin" d="M28 43V18M36 43V18" />
              <polygon class="rtg-spear rtg-primary-fill" points="32,2 22,23 32,17 42,23" />
              <path class="rtg-primary" d="M17 43h30M23 47l9 14 9-14" />
              <path class="rtg-secondary rtg-thin" d="m22 37 10 5 10-5" />
            `,
          };

          export function baseRuneGlyphId(rune: RuneTreeId): RuneTreeGlyphId {
            return `base-${rune}` as RuneTreeGlyphId;
          }

          export function evolutionGlyphId(path: string, tier: 1 | 2): RuneTreeGlyphId {
            return `${path}-${tier}` as RuneTreeGlyphId;
          }

          export function getRuneTreeGlyphMarkup(id: RuneTreeGlyphId): string {
            return GLYPHS[id];
          }

          export function createRuneTreeGlyph(id: RuneTreeGlyphId): SVGSVGElement {
            const svg = document.createElementNS(SVG_NS, 'svg');
            svg.classList.add('rune-tree-glyph');
            svg.setAttribute('viewBox', '0 0 64 64');
            svg.setAttribute('focusable', 'false');
            svg.setAttribute('aria-hidden', 'true');
            svg.dataset.glyph = id;
            svg.innerHTML = GLYPHS[id];
            return svg;
          }
          EOF

          cat > rune-ball/src/rune-tree-visual-system.css <<'EOF'
          /* P8.3.2 — Shared effect-first SVG grammar for the Rune Tree. */
          .rune-tree-workspace {
            --rt-left: 111 233 255;
            --rt-right: 215 86 255;
            --rt-muted: 113 130 155;
          }

          .rune-tree-graph {
            overflow: hidden;
            background:
              radial-gradient(circle at 50% 0%, rgb(111 233 255 / 5%), transparent 42%),
              rgb(8 11 23 / 92%);
          }

          .rune-tree-base-effect::before,
          .rune-tree-base-effect::after,
          .rune-tree-node-sigil::before,
          .rune-tree-node-sigil::after {
            content: none !important;
          }

          .rune-tree-base-effect > span,
          .rune-tree-node-sigil-core {
            display: none !important;
          }

          .rune-tree-base-effect,
          .rune-tree-node-sigil {
            display: grid !important;
            place-items: center;
            border: 0 !important;
            background: transparent !important;
            box-shadow: none !important;
          }

          .rune-tree-base-effect {
            width: 62px;
            height: 62px;
          }

          .rune-tree-node-sigil {
            width: 62px;
            height: 62px;
          }

          .rune-tree-glyph {
            width: 100%;
            height: 100%;
            overflow: visible;
            color: rgb(var(--rt-branch, var(--rt-left)));
            filter: drop-shadow(0 0 7px rgb(var(--rt-branch, var(--rt-left)) / 12%));
          }

          .rune-tree-glyph .rtg-primary,
          .rune-tree-glyph .rtg-secondary,
          .rune-tree-glyph .rtg-ghost,
          .rune-tree-glyph .rtg-node {
            fill: none;
            vector-effect: non-scaling-stroke;
          }

          .rune-tree-glyph .rtg-primary {
            stroke: rgb(var(--rt-branch, var(--rt-left)) / 92%);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
          }

          .rune-tree-glyph .rtg-secondary {
            stroke: rgb(143 77 255 / 78%);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
          }

          .rune-tree-glyph .rtg-thin {
            stroke-width: 1.25;
          }

          .rune-tree-glyph .rtg-ghost {
            stroke: rgb(var(--rt-branch, var(--rt-left)) / 20%);
            stroke-width: 1;
          }

          .rune-tree-glyph .rtg-core {
            fill: #f0fbff;
            stroke: rgb(var(--rt-branch, var(--rt-left)) / 92%);
            stroke-width: 1.5;
          }

          .rune-tree-glyph .rtg-core-peak {
            filter: drop-shadow(0 0 5px rgb(var(--rt-branch, var(--rt-left)) / 70%));
          }

          .rune-tree-glyph .rtg-node {
            stroke: rgb(var(--rt-branch, var(--rt-left)) / 86%);
            stroke-width: 1.7;
            fill: rgb(var(--rt-branch, var(--rt-left)) / 10%);
          }

          .rune-tree-glyph .rtg-node-secondary {
            stroke: rgb(215 86 255 / 88%);
          }

          .rune-tree-glyph .rtg-facet,
          .rune-tree-glyph .rtg-spear {
            vector-effect: non-scaling-stroke;
            stroke-linecap: round;
            stroke-linejoin: round;
          }

          .rune-tree-glyph .rtg-primary-fill {
            fill: rgb(var(--rt-branch, var(--rt-left)) / 13%);
            stroke: rgb(var(--rt-branch, var(--rt-left)) / 92%);
            stroke-width: 1.6;
          }

          .rune-tree-glyph .rtg-secondary-fill {
            fill: rgb(215 86 255 / 10%);
            stroke: rgb(215 86 255 / 78%);
            stroke-width: 1.4;
          }

          .rune-tree-base-effect--vortex,
          .rune-tree-base-effect--split,
          .rune-tree-base-effect--chain {
            --rt-branch: var(--rt-left);
          }

          .rune-tree-base-node {
            width: 86px;
            min-height: 86px;
            border-radius: 24px;
            border-color: rgb(111 233 255 / 34%);
            background: linear-gradient(180deg, rgb(17 31 50 / 78%), rgb(9 14 27 / 90%));
            box-shadow: inset 0 1px rgb(255 255 255 / 3%);
          }

          .rune-tree-base-node[aria-pressed='true'] {
            border-color: rgb(234 246 255 / 76%);
            box-shadow: 0 0 0 2px rgb(111 233 255 / 9%), 0 0 24px rgb(111 233 255 / 10%);
          }

          .rune-tree-branch[data-path='gravity-well'],
          .rune-tree-branch[data-path='prism'] {
            --rt-branch: var(--rt-left);
          }

          .rune-tree-branch[data-path='orbit'],
          .rune-tree-branch[data-path='lance'] {
            --rt-branch: var(--rt-right);
          }

          .rune-tree-branch::before,
          .rune-tree-rail {
            background: rgb(var(--rt-branch) / 28%);
          }

          .rune-tree-path-mark {
            border-color: rgb(var(--rt-branch) / 45%);
            background: rgb(var(--rt-branch) / 5%);
          }

          .rune-tree-path-mark::after {
            inset: 4px !important;
            width: auto !important;
            height: auto !important;
            border: 0 !important;
            border-radius: 2px !important;
            background: rgb(var(--rt-branch) / 86%) !important;
            box-shadow: 0 0 8px rgb(var(--rt-branch) / 30%) !important;
            transform: rotate(45deg) !important;
          }

          .rune-tree-evolution-node {
            width: 92px;
            min-height: 92px;
            border-radius: 24px;
            border-color: rgb(var(--rt-branch) / 22%);
            background: linear-gradient(180deg, rgb(17 23 40 / 82%), rgb(10 14 27 / 90%));
            box-shadow: inset 0 1px rgb(255 255 255 / 3%);
          }

          .rune-tree-branch[data-equipped='false'] .rune-tree-evolution-node {
            opacity: 0.72;
          }

          .rune-tree-branch[data-equipped='true'] .rune-tree-evolution-node {
            border-color: rgb(var(--rt-branch) / 48%);
            background: linear-gradient(180deg, rgb(var(--rt-branch) / 8%), rgb(10 16 30 / 92%));
            opacity: 1;
          }

          .rune-tree-branch[data-equipped='true']::before,
          .rune-tree-branch[data-equipped='true'] .rune-tree-rail {
            background: rgb(var(--rt-branch) / 72%);
            box-shadow: 0 0 10px rgb(var(--rt-branch) / 18%);
          }

          .rune-tree-branch[data-equipped='true'] .rune-tree-path-mark {
            border-color: rgb(var(--rt-branch) / 84%);
            box-shadow: 0 0 12px rgb(var(--rt-branch) / 14%);
          }

          .rune-tree-evolution-node[aria-pressed='true'] {
            border-color: rgb(240 251 255 / 88%);
            background: linear-gradient(180deg, rgb(var(--rt-branch) / 13%), rgb(13 21 37 / 96%));
            box-shadow:
              0 0 0 2px rgb(var(--rt-branch) / 11%),
              0 0 28px rgb(var(--rt-branch) / 15%);
          }

          .rune-tree-evolution-node[aria-pressed='true'] .rune-tree-glyph {
            filter: drop-shadow(0 0 9px rgb(var(--rt-branch) / 32%));
          }

          .rune-tree-future-node,
          .rune-tree-future-path-mark {
            --rt-branch: var(--rt-muted);
          }

          .rune-tree-future-node {
            border-radius: 24px;
            background: rgb(9 13 24 / 62%);
          }

          .rune-tree-future-node-mark {
            border-radius: 14px;
          }

          @media (max-width: 350px) {
            .rune-tree-base-node {
              width: 80px;
              min-height: 80px;
            }

            .rune-tree-evolution-node,
            .rune-tree-future-node {
              width: 84px;
              min-height: 84px;
            }

            .rune-tree-base-effect,
            .rune-tree-node-sigil {
              width: 56px;
              height: 56px;
            }
          }

          @media (prefers-reduced-transparency: reduce) {
            .rune-tree-base-node,
            .rune-tree-evolution-node {
              background: #0d1626;
            }
          }

          html[data-reduced-transparency='true'] .rune-tree-base-node,
          html[data-reduced-transparency='true'] .rune-tree-evolution-node {
            background: #0d1626;
          }

          @media (prefers-contrast: more) {
            .rune-tree-base-node,
            .rune-tree-evolution-node {
              border-width: 2px;
            }
          }
          EOF

          cat > rune-ball/tests/rune-tree-glyphs.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import {
            baseRuneGlyphId,
            evolutionGlyphId,
            getRuneTreeGlyphMarkup,
          } from '../src/presentation/RuneTreeGlyphs';

          describe('RuneTreeGlyphs', () => {
            it('uses effect glyph identities for every base Rune', () => {
              expect(baseRuneGlyphId('vortex')).toBe('base-vortex');
              expect(baseRuneGlyphId('split')).toBe('base-split');
              expect(baseRuneGlyphId('chain')).toBe('base-chain');
              expect(getRuneTreeGlyphMarkup('base-chain')).toContain('rtg-node');
            });

            it('escalates Prism from one wing layer to a layered T2 silhouette', () => {
              const t1 = getRuneTreeGlyphMarkup(evolutionGlyphId('prism', 1));
              const t2 = getRuneTreeGlyphMarkup(evolutionGlyphId('prism', 2));
              expect((t1.match(/rtg-facet/g) ?? []).length).toBe(2);
              expect((t2.match(/rtg-facet/g) ?? []).length).toBe(4);
            });

            it('keeps Lance as a continuous spear silhouette rather than bead nodes', () => {
              const t1 = getRuneTreeGlyphMarkup(evolutionGlyphId('lance', 1));
              const t2 = getRuneTreeGlyphMarkup(evolutionGlyphId('lance', 2));
              expect(t1).toContain('rtg-spear');
              expect(t2).toContain('rtg-spear');
              expect(t2).not.toContain('rtg-node');
            });
          });
          EOF

          cat > docs/plans/rune-ball/P8-3-2-RUNE-TREE-VISUAL-SYSTEM.md <<'EOF'
          # P8.3.2 — Rune Tree Visual System Pass

          ## Risk question

          Can Rune Ball establish a reusable visual grammar for Rune evolution so Vortex, Split, and future Chain content read as one authored system rather than separately styled skill trees?

          ## Visual ownership

          - **Rune Card = gesture identity.** `○ / V / Z` remain the input vocabulary and do not repeat inside Tree nodes.
          - **Tree node = gameplay effect.** Base, T1, and T2 use effect-first SVG glyphs.
          - **Branch = playstyle.** Left/right branches use consistent accent families plus line weight, brightness, and framing so state never depends on color alone.
          - **Detail surface = language.** Names, mechanics, play pattern, and thresholds stay below the graph.

          ## Glyph grammar

          All glyphs share a 64×64 coordinate system and a small primitive vocabulary: core, field/trajectory stroke, facet/spear fill, and secondary node. T2 adds structural complexity rather than simply scaling T1.

          - Vortex base: rotating field around a core.
          - Gravity: concentric compression; T2 adds stronger inward spokes and peak core.
          - Orbit: orbital ellipse + satellite; T2 adds a second orbital plane.
          - Split base: one core splitting into mirrored force directions.
          - Prism: symmetric crystalline wings; T2 adds an outer wing layer.
          - Lance: one continuous spear; T2 extends shaft, guard, and spearhead complexity.
          - Chain base: connected propagation nodes. Its evolution branches remain intentionally unauthored until P8.4.

          ## State grammar

          - Configured branch: brighter connector rail and branch frame.
          - Selected node: white edge + accent halo.
          - Non-configured branch: remains readable but lower emphasis.
          - Future node: muted/dashed treatment, never presented as a purchasable lock.
          - Focus-visible remains explicit for keyboard/accessibility navigation.

          ## Architecture

          `RuneTreeGlyphs.ts` owns effect glyph SVG markup and identity mapping. `RuneTreePanel` owns interaction/semantics. CSS owns materials, state hierarchy, accessibility fallbacks, and responsive sizing. Gameplay/domain systems do not depend on Tree glyphs.

          ## Scope guard

          No Chain evolution mechanics, new Rune effects, new Tree navigation, progression currency, shaders, external UI libraries, or gameplay collision changes.

          ## Phone gate

          1. Rune Cards still read as the gesture selector while Tree nodes read as effects.
          2. Vortex and Split feel like members of the same visual system.
          3. Gravity vs Orbit and Prism vs Lance remain distinguishable without node labels.
          4. T2 reads as an evolved silhouette rather than a larger T1 icon.
          5. Configured path and currently selected node are clear without relying only on cyan/magenta color.
          6. Chain looks intentionally future-authored rather than broken or paywalled.
          EOF

          python - <<'PY'
          from pathlib import Path

          panel_path = Path('rune-ball/src/presentation/RuneTreePanel.ts')
          panel = panel_path.read_text()
          old_imports = "import '../rune-tree.css';\nimport '../rune-tree-refinement.css';"
          new_imports = "import { baseRuneGlyphId, createRuneTreeGlyph, evolutionGlyphId } from './RuneTreeGlyphs';\nimport '../rune-tree.css';\nimport '../rune-tree-refinement.css';\nimport '../rune-tree-visual-system.css';"
          if old_imports not in panel:
              raise SystemExit('RuneTreePanel style import anchor not found')
          panel = panel.replace(old_imports, new_imports, 1)

          old_sigil = """    const sigil = document.createElement('span');
    sigil.className = `rune-tree-node-sigil rune-tree-node-sigil--${path} rune-tree-node-sigil--tier-${tier}`;
    sigil.setAttribute('aria-hidden', 'true');
    const core = document.createElement('span');
    core.className = 'rune-tree-node-sigil-core';
    sigil.append(core);
    button.append(sigil);"""
          new_sigil = """    const sigil = document.createElement('span');
    sigil.className = `rune-tree-node-sigil rune-tree-node-sigil--${path} rune-tree-node-sigil--tier-${tier}`;
    sigil.setAttribute('aria-hidden', 'true');
    sigil.append(createRuneTreeGlyph(evolutionGlyphId(path, tier)));
    button.append(sigil);"""
          if old_sigil not in panel:
              raise SystemExit('RuneTreePanel evolution sigil anchor not found')
          panel = panel.replace(old_sigil, new_sigil, 1)

          old_base = """  private makeBaseEffect(runeId: RuneTreeId): HTMLElement {
    const effect = document.createElement('span');
    effect.className = `rune-tree-base-effect rune-tree-base-effect--${runeId}`;
    effect.setAttribute('aria-hidden', 'true');

    for (const part of ['core', 'accent-a', 'accent-b']) {
      const element = document.createElement('span');
      element.className = `rune-tree-base-effect-${part}`;
      effect.append(element);
    }
    return effect;
  }"""
          new_base = """  private makeBaseEffect(runeId: RuneTreeId): HTMLElement {
    const effect = document.createElement('span');
    effect.className = `rune-tree-base-effect rune-tree-base-effect--${runeId}`;
    effect.setAttribute('aria-hidden', 'true');
    effect.append(createRuneTreeGlyph(baseRuneGlyphId(runeId)));
    return effect;
  }"""
          if old_base not in panel:
              raise SystemExit('RuneTreePanel base effect anchor not found')
          panel = panel.replace(old_base, new_base, 1)
          panel_path.write_text(panel)

          readme_path = Path('rune-ball/README.md')
          readme = readme_path.read_text()
          readme = readme.replace('**P8.3 — Split Evolution Gate**', '**P8.3.2 — Rune Tree Visual System Pass**', 1)
          marker = '- One compact Rune Evolution Status follows the most recently progressed authored Rune, avoiding a second persistent HUD row.\n'
          addition = "\nP8.3.1 strengthened Split runtime silhouettes with Prism wings and a continuous Lance. P8.3.2 now establishes a shared **effect-first SVG grammar** for Rune Tree nodes: Rune Cards retain gesture identity, Tree nodes depict gameplay effects, branch state uses connector/frame hierarchy in addition to color, and Chain receives only its authored Base effect identity until P8.4.\n"
          if marker not in readme:
              raise SystemExit('README P8.3 anchor not found')
          readme = readme.replace(marker, marker + addition, 1)
          readme_path.write_text(readme)
          PY

          rm .github/workflows/tmp-rune-ball-p8-3-2-visual-system.yml
      - name: Install dependencies
        working-directory: rune-ball
        run: npm ci
      - name: Run tests
        working-directory: rune-ball
        run: npm test
      - name: Build
        working-directory: rune-ball
        run: npm run build
      - name: Commit clean product changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(rune-ball): establish Rune Tree visual system'
          git push origin HEAD:feat/rune-ball-p8-3-2-rune-tree-visual-system
