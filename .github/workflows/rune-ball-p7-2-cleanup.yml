name: Rune Ball P7.2 cleanup

on:
  push:
    branches:
      - feat/rune-ball-p7-2-vortex-evolution
    paths:
      - .github/workflows/rune-ball-p7-2-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rune-ball-p7-2-vortex-evolution
          fetch-depth: 0
      - name: Remove generated artifacts and temporary workflow
        run: |
          rm -rf rune-ball/node_modules rune-ball/dist
          git rm .github/workflows/rune-ball-p7-2-cleanup.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u rune-ball/node_modules rune-ball/dist
          git commit -m "chore(rune-ball): remove generated P7.2 artifacts"
          git push origin HEAD:feat/rune-ball-p7-2-vortex-evolution
