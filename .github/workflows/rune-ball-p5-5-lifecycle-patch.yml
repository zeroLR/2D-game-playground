name: Rune Ball P5.5 lifecycle patch

on:
  push:
    branches:
      - fix/rune-ball-p5-5-background-audio

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rune-ball-p5-5-background-audio
      - name: Patch background audio lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path

          audio_path = Path('rune-ball/src/audio/AudioDirector.ts')
          text = audio_path.read_text()

          text = text.replace(
              "  private overdrive = false;\n  private activeSfx = 0;",
              "  private overdrive = false;\n  private activeSfx = 0;\n  private readonly activeSfxSources = new Set<AudioBufferSourceNode>();\n  private backgrounded = false;\n  private resumeBgmAfterBackground = false;\n  private resumeContextAfterBackground = false;",
          )
          text = text.replace(
              "    if ((this.runtimeState === 'playing' || this.runtimeState === 'partial') && this.bgm) {",
              "    if (!this.backgrounded && (this.runtimeState === 'playing' || this.runtimeState === 'partial') && this.bgm) {",
          )

          lifecycle = (
              "  pauseForBackground(): void {\n"
              "    if (this.backgrounded) return;\n"
              "    this.backgrounded = true;\n"
              "    this.resumeBgmAfterBackground = this.enabled && !!this.bgm && !this.bgm.paused;\n"
              "    this.resumeContextAfterBackground = this.context?.state === 'running';\n\n"
              "    this.bgm?.pause();\n"
              "    for (const source of this.activeSfxSources) {\n"
              "      try {\n"
              "        source.stop();\n"
              "      } catch {\n"
              "        // Source may already have completed between visibility events.\n"
              "      }\n"
              "    }\n\n"
              "    if (this.context?.state === 'running') {\n"
              "      void this.context.suspend().catch((error: unknown) => {\n"
              "        console.debug('[Rune Ball] AudioContext background suspend skipped.', error);\n"
              "      });\n"
              "    }\n"
              "  }\n\n"
              "  resumeFromBackground(): void {\n"
              "    if (!this.backgrounded) return;\n"
              "    this.backgrounded = false;\n\n"
              "    const shouldResumeBgm = this.resumeBgmAfterBackground;\n"
              "    const shouldResumeContext = this.resumeContextAfterBackground;\n"
              "    this.resumeBgmAfterBackground = false;\n"
              "    this.resumeContextAfterBackground = false;\n\n"
              "    if (!this.enabled) return;\n\n"
              "    if (shouldResumeContext && this.context?.state === 'suspended') {\n"
              "      void this.context.resume().catch((error: unknown) => {\n"
              "        console.debug('[Rune Ball] AudioContext foreground resume skipped.', error);\n"
              "      });\n"
              "    }\n\n"
              "    if (shouldResumeBgm && this.bgm && (this.runtimeState === 'playing' || this.runtimeState === 'partial')) {\n"
              "      void this.bgm.play().catch((error: unknown) => {\n"
              "        console.debug('[Rune Ball] BGM foreground resume skipped.', error);\n"
              "      });\n"
              "    }\n"
              "  }\n\n"
          )
          marker = "  update(state: MixState): void {"
          if marker not in text:
              raise SystemExit('AudioDirector update marker not found')
          text = text.replace(marker, lifecycle + marker, 1)
          text = text.replace(
              "    if (!this.enabled || !context || !destination || !buffer || context.state !== 'running') return;",
              "    if (this.backgrounded || !this.enabled || !context || !destination || !buffer || context.state !== 'running') return;",
          )
          text = text.replace(
              "    this.activeSfx += 1;\n    source.onended = () => {\n      this.activeSfx = Math.max(0, this.activeSfx - 1);",
              "    this.activeSfx += 1;\n    this.activeSfxSources.add(source);\n    source.onended = () => {\n      this.activeSfx = Math.max(0, this.activeSfx - 1);\n      this.activeSfxSources.delete(source);",
          )
          text = text.replace(
              "    this.sfxBuffers.clear();\n    this.activeSfx = 0;",
              "    for (const source of this.activeSfxSources) {\n      try {\n        source.stop();\n      } catch {\n        // Best-effort cleanup.\n      }\n    }\n    this.activeSfxSources.clear();\n    this.sfxBuffers.clear();\n    this.activeSfx = 0;",
          )
          audio_path.write_text(text)

          main_path = Path('rune-ball/src/main.ts')
          main = main_path.read_text()
          marker = "  const audio = new AudioDirector();\n\n  try {"
          replacement = (
              "  const audio = new AudioDirector();\n\n"
              "  const syncAudioVisibility = (): void => {\n"
              "    if (document.visibilityState === 'hidden') {\n"
              "      audio.pauseForBackground();\n"
              "      return;\n"
              "    }\n"
              "    audio.resumeFromBackground();\n"
              "  };\n"
              "  const handlePageHide = (): void => audio.pauseForBackground();\n"
              "  const handlePageShow = (): void => {\n"
              "    if (document.visibilityState === 'visible') audio.resumeFromBackground();\n"
              "  };\n\n"
              "  document.addEventListener('visibilitychange', syncAudioVisibility);\n"
              "  window.addEventListener('pagehide', handlePageHide);\n"
              "  window.addEventListener('pageshow', handlePageShow);\n\n"
              "  try {"
          )
          if marker not in main:
              raise SystemExit('main audio marker not found')
          main = main.replace(marker, replacement, 1)
          main = main.replace('Rune Ball P5.4 buffered SFX bootstrap starting.', 'Rune Ball P5.5 background-audio lifecycle bootstrap starting.')
          main = main.replace('Rune Ball P5.4 buffered SFX playtest', 'Rune Ball P5.5 background-audio playtest')
          main = main.replace('Rune Ball] P5.4 ready. SFX are decoded AudioBuffers before gameplay starts.', 'Rune Ball] P5.5 ready. Audio pauses while the page is backgrounded.')
          main_path.write_text(main)

          test_path = Path('rune-ball/tests/audio-director.test.ts')
          test = test_path.read_text()
          test = test.replace(
              "    await expect(audio.unlock()).resolves.toBe(false);",
              "    await expect(audio.unlock()).resolves.toBe(false);\n    expect(() => audio.pauseForBackground()).not.toThrow();\n    expect(() => audio.resumeFromBackground()).not.toThrow();",
          )
          test_path.write_text(test)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/rune-ball-p5-5-lifecycle-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rune-ball/src/audio/AudioDirector.ts rune-ball/src/main.ts rune-ball/tests/audio-director.test.ts .github/workflows/rune-ball-p5-5-lifecycle-patch.yml
          git commit -m "fix(rune-ball): pause audio when app backgrounds"
          git push origin HEAD:fix/rune-ball-p5-5-background-audio
