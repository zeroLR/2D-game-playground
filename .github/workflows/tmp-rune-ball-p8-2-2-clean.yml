name: Rune Ball P8.2.2 cleanup

on:
  push:
    branches:
      - feat/rune-ball-p8-2-2-runtime-readability

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rune-ball-p8-2-2-runtime-readability
          fetch-depth: 0

      - name: Remove generated files from branch history tip
        run: |
          git rm -r rune-ball/node_modules rune-ball/dist
          rm .github/workflows/tmp-rune-ball-p8-2-2-clean.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tmp-rune-ball-p8-2-2-clean.yml
          git commit -m 'chore(rune-ball): remove generated build artifacts'
          git push origin HEAD:feat/rune-ball-p8-2-2-runtime-readability
