name: Rune Ball P6.1 scene hook patch

on:
  push:
    branches:
      - feat/rune-ball-p6-1-session-loop

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rune-ball-p6-1-session-loop
      - name: Patch DestructionScene session hooks
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('rune-ball/src/presentation/DestructionScene.ts')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f'{label} marker missing')
              text = text.replace(old, new, 1)

          replace_once(
              'export class DestructionScene extends Container {',
              "export interface DestructionSceneCallbacks {\n  onPlayerAction?: () => void;\n  onGameplayEvent?: (event: DestructionEvent) => void;\n}\n\nexport class DestructionScene extends Container {",
              'class',
          )
          replace_once(
              '  private reducedMotion = false;\n',
              "  private reducedMotion = false;\n  private inputEnabled = true;\n  private readonly onPlayerAction?: () => void;\n  private readonly onGameplayEvent?: (event: DestructionEvent) => void;\n",
              'fields',
          )
          replace_once(
              '  constructor(width: number, height: number, audio: AudioDirector) {',
              '  constructor(width: number, height: number, audio: AudioDirector, callbacks: DestructionSceneCallbacks = {}) {',
              'constructor signature',
          )
          replace_once(
              '    this.audio = audio;\n',
              '    this.audio = audio;\n    this.onPlayerAction = callbacks.onPlayerAction;\n    this.onGameplayEvent = callbacks.onGameplayEvent;\n',
              'constructor body',
          )
          replace_once(
              '  private readonly handlePointerDown = (event: FederatedPointerEvent): void => {\n    if (this.activePointerId !== null) return;',
              "  setInputEnabled(enabled: boolean): void {\n    this.inputEnabled = enabled;\n    this.inputSurface.eventMode = enabled ? 'static' : 'none';\n    if (!enabled) this.clearPointer();\n  }\n\n  private readonly handlePointerDown = (event: FederatedPointerEvent): void => {\n    if (!this.inputEnabled || this.activePointerId !== null) return;",
              'pointer down',
          )
          replace_once(
              '    if (path.length > 1) {',
              '    if (success) this.onPlayerAction?.();\n\n    if (path.length > 1) {',
              'player action',
          )
          replace_once(
              '  private handleGameplayEvent(event: DestructionEvent): void {\n    switch (event.type) {',
              '  private handleGameplayEvent(event: DestructionEvent): void {\n    this.onGameplayEvent?.(event);\n    switch (event.type) {',
              'gameplay event',
          )

          path.write_text(text)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/rune-ball-p6-1-scene-hook.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rune-ball/src/presentation/DestructionScene.ts .github/workflows/rune-ball-p6-1-scene-hook.yml
          git commit -m "feat(rune-ball): expose P6 scene lifecycle hooks"
          git push origin HEAD:feat/rune-ball-p6-1-session-loop
