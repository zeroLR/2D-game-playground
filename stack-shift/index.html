<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#35228f" />
  <title>Stack Shift</title>
</head>
<body>
  <div id="app">
    <header class="hud">
      <div class="badge"><small>LEVEL</small><strong>01</strong></div>
      <div class="badge moves"><small>MOVES</small><strong id="moves">16</strong></div>
      <button id="reset" aria-label="Reset">↻</button>
    </header>
    <main id="game"></main>
    <footer>
      <strong>SWIPE TO CHANGE GRAVITY</strong>
      <div class="gravity"><span>‹‹</span><div class="track"><i id="gravity-dot"></i></div><span>››</span></div>
      <p id="direction">GRAVITY ↓</p>
    </footer>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
